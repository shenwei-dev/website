<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查询村落</title>
  <style>
    :root{--bg:#f4f2ed;--paper:#fffefa;--ink:#202522;--muted:#7b817d;--line:#deded6;--accent:#b94b32;--soft:#ebece5;--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}body{letter-spacing:.01em}
    .wrap{max-width:1120px;margin:0 auto;padding:38px 24px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--ink);padding-bottom:24px;margin-bottom:32px}.kicker{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-bottom:14px}.brand{font-family:Georgia,"Songti SC",serif;font-size:clamp(38px,6vw,76px);line-height:.92;letter-spacing:-.07em;margin:0}.intro{max-width:450px;color:var(--muted);font-size:13px;line-height:1.8;margin:16px 0 0}.stamp{width:58px;height:58px;border:1px solid var(--ink);display:grid;place-items:center;color:var(--accent);font-family:Georgia,serif;font-size:25px;transform:rotate(45deg);margin:10px 10px 0 0}.stamp span{transform:rotate(-45deg)}
    .search-panel{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}.field{position:relative}.field label{display:block;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}.select,.search{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0;padding:13px 14px;font:inherit;font-size:13px;outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}.select:focus,.search:focus{border-color:var(--accent);box-shadow:0 3px 0 rgba(185,75,50,.13)}.search{padding-left:38px}.search-symbol{position:absolute;left:14px;bottom:12px;color:var(--accent);font-size:16px}.actions{display:flex;justify-content:space-between;align-items:center;padding:14px 0 22px;border-bottom:1px solid var(--line);margin-bottom:20px}.status{font-size:12px;color:var(--muted)}.status strong{color:var(--ink)}.clear{border:0;background:transparent;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:5px 0}.clear:hover{text-decoration:underline}
    .result-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.result-title{font-family:Georgia,"Songti SC",serif;font-size:27px;margin:0}.count{font-size:12px;color:var(--muted)}.table-wrap{border-top:2px solid var(--ink);overflow:auto;background:var(--paper)}table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:13px 14px;border-bottom:1px solid var(--line);font-weight:800}td{padding:15px 14px;border-bottom:1px solid #ecece5;vertical-align:top}tbody tr:hover{background:#f8f5ed}.village{font-family:Georgia,"Songti SC",serif;font-size:16px;color:var(--ink)}.empty{text-align:center;padding:70px 20px;color:var(--muted);font-size:13px;line-height:1.8}.empty b{display:block;color:var(--ink);font-family:Georgia,serif;font-size:22px;margin-bottom:7px}.pager{display:flex;justify-content:space-between;align-items:center;padding-top:16px;color:var(--muted);font-size:12px}.pager button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 12px;font:inherit;cursor:pointer}.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}.pager button:disabled{opacity:.35;cursor:not-allowed}.pager-actions{display:flex;gap:7px}.footer{margin-top:42px;color:#9a9d98;font-size:11px;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:15px}.error{color:var(--accent)}
    @media(max-width:800px){.search-panel{grid-template-columns:1fr 1fr}.field:first-child{grid-column:1/-1}.top{gap:20px}.intro{max-width:330px}}
    @media(max-width:520px){.wrap{padding:25px 16px 42px}.top{margin-bottom:24px}.stamp{display:none}.search-panel{grid-template-columns:1fr}.field:first-child{grid-column:auto}.actions{align-items:flex-start;gap:12px;flex-direction:column}.brand{font-size:52px}.footer{display:block;line-height:1.8}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <section aria-label="查询条件">
      <div class="search-panel">
        <div class="field"><label for="query">村名搜索</label><span class="search-symbol">⌕</span><input id="query" class="search" type="search" placeholder="输入村名……" autocomplete="off"></div>
        <div class="field"><label for="province">省份</label><select id="province" class="select"><option value="">全部省份</option></select></div>
        <div class="field"><label for="city">城市</label><select id="city" class="select" disabled><option value="">全部城市</option></select></div>
        <div class="field"><label for="area">县 / 区</label><select id="area" class="select" disabled><option value="">全部县 / 区</option></select></div>
      </div>
      <div class="actions"><div class="status" id="status"></div><button class="clear" id="clear">清除筛选</button></div>
    </section>

    <section aria-live="polite">
      <div class="result-head"><div></div><div class="count" id="count"></div></div>
      <div class="table-wrap" id="tableWrap"></div>
      <div class="pager" id="pager" hidden></div>
    </section>

  </main>
<script>
(() => {
  const DATA_FILE = './VillagesData.csv.gz';
  const PAGE_SIZE = 100;
  const state = { rows: [], result: [], page: 1, provinces: new Map(), cities: new Map(), areas: new Map() };
  const $ = id => document.getElementById(id);
  const els = { query:$('query'), province:$('province'), city:$('city'), area:$('area'), status:$('status'), clear:$('clear'), count:$('count'), table:$('tableWrap'), pager:$('pager') };

  const clean = value => String(value ?? '').replace(/^\uFEFF/,'').trim();
  function parseCSV(text){
    text=text.replace(/^\uFEFF/,''); const rows=[]; let row=[], cell='', quoted=false;
    for(let i=0;i<text.length;i++){ const c=text[i], n=text[i+1]; if(quoted){ if(c==='"'&&n==='"'){cell+='"';i++;} else if(c==='"') quoted=false; else cell+=c; } else if(c==='"') quoted=true; else if(c===','){row.push(cell);cell='';} else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';} else cell+=c; }
    if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row);} if(!rows.length)return[];
    const headers=rows.shift().map(clean); return rows.filter(r=>r.some(v=>clean(v)!=='')).map(r=>Object.fromEntries(headers.map((h,i)=>[h,clean(r[i])] )));
  }
  async function loadGzipCSV(){
    if(!('DecompressionStream' in window)) throw new Error('浏览器不支持 GZIP 解压，请使用新版 Chrome、Edge 或 Firefox。');
    const response=await fetch(DATA_FILE); if(!response.ok) throw new Error(`找不到数据文件（HTTP ${response.status}）。`);
    const bytes=await response.arrayBuffer(); const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')); return new Response(stream).text();
  }
  function indexRows(){
    state.rows.forEach(row=>{
      const p=row.provinceName,c=row.cityName,a=row.areaName;
      if(p&&!state.provinces.has(p)) state.provinces.set(p,p);
      if(c&&!state.cities.has(c)) state.cities.set(c,{name:c,province:p});
      if(a&&!state.areas.has(a)) state.areas.set(a,{name:a,city:c,province:p});
    });
    fill(els.province,[...state.provinces.keys()].sort((a,b)=>a.localeCompare(b,'zh-CN')),'全部省份');
    fill(els.city,[], '全部城市'); fill(els.area,[], '全部县 / 区');
  }
  function fill(select, values, placeholder){ select.innerHTML=`<option value="">${placeholder}</option>`; values.forEach(value=>{const o=document.createElement('option');o.value=typeof value==='string'?value:value.name;o.textContent=typeof value==='string'?value:value.name;select.appendChild(o);}); select.disabled=values.length===0&&select!==els.province; }
  function refreshOptions(){
    const p=els.province.value,c=els.city.value;
    const cities=[...state.cities.values()].filter(x=>!p||x.province===p).sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
    const areas=[...state.areas.values()].filter(x=>(!p||x.province===p)&&(!c||x.city===c)).sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
    fill(els.city,cities,'全部城市'); els.city.value=cities.some(x=>x.name===c)?c:''; fill(els.area,areas,'全部县 / 区');
  }
  function refresh(){
    const q=els.query.value.trim().toLowerCase(),p=els.province.value,c=els.city.value,a=els.area.value;
    state.result=state.rows.filter(r=>(!p||r.provinceName===p)&&(!c||r.cityName===c)&&(!a||r.areaName===a)&&(!q||r.name.toLowerCase().includes(q)));
    state.page=1; render();
  }
  function render(){
    const rows=state.result; els.count.textContent=rows.length.toLocaleString()+' 条';
    if(!rows.length){els.table.innerHTML='<div class="empty"><b>没有找到结果</b>请更换村名或调整筛选条件。</div>';els.pager.hidden=true;return;}
    const pages=Math.ceil(rows.length/PAGE_SIZE); state.page=Math.min(state.page,pages); const start=(state.page-1)*PAGE_SIZE; const shown=rows.slice(start,start+PAGE_SIZE);
    els.table.innerHTML=`<table><thead><tr><th>村名</th><th>省份</th><th>城市</th><th>县 / 区</th></tr></thead><tbody>${shown.map(r=>`<tr><td class="village">${esc(r.name)}</td><td>${esc(r.provinceName)}</td><td>${esc(r.cityName)}</td><td>${esc(r.areaName)}</td></tr>`).join('')}</tbody></table>`;
    els.pager.hidden=pages<=1; els.pager.innerHTML=pages>1?`<span>第 ${state.page} / ${pages} 页</span><div class="pager-actions"><button id="prev" ${state.page===1?'disabled':''}>上一页</button><button id="next" ${state.page===pages?'disabled':''}>下一页</button></div>`:'';
    if(pages>1){$('prev').onclick=()=>{state.page--;render();};$('next').onclick=()=>{state.page++;render();};}
  }
  const esc = value => String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  els.province.onchange=()=>{els.city.value='';els.area.value='';refreshOptions();refresh();};
  els.city.onchange=()=>{els.area.value='';refreshOptions();refresh();};
  els.area.onchange=refresh; els.query.oninput=refresh;
  els.clear.onclick=()=>{els.query.value='';els.province.value='';els.city.value='';els.area.value='';refreshOptions();refresh();};
  loadGzipCSV().then(text=>{ state.rows=parseCSV(text); indexRows(); els.status.textContent=''; refresh(); }).catch(()=>{els.status.textContent='数据加载失败';els.status.className='status error';els.table.innerHTML='<div class="empty"><b>数据加载失败</b></div>';els.count.textContent='—';});
})();
</script>
</body>
</html>
