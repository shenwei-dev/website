utton{border:0;background:transparent;color:#8ba0a5}.levels{display:flex;gap:5px;padding:4px;background:rgba(223,233,232,.68);border-radius:9px}.levels button{border:0;border-radius:6px;background:transparent;color:#789096;padding:7px 10px;font-size:11px}.levels button:hover,.levels button.selected{background:#fffdf6;color:#213b55;box-shadow:0 2px 8px rgba(33,59,85,.08)}.result{min-height:29px;display:flex;justify-content:space-between;align-items:center;color:#92a2a3;font-size:11px}.result span{display:flex;align-items:center;gap:6px}.result button{display:flex;gap:4px;align-items:center;border:0;background:transparent;color:#e87961;font-size:11px}.list{display:grid;gap:12px;padding-top:8px}.card{display:grid;grid-template-columns:68px minmax(0,1fr);background:rgba(253,253,248,.9);border:1px solid rgba(35,61,82,.1);border-radius:11px;box-shadow:0 5px 20px rgba(35,61,82,.035);overflow:hidden;animation:in .35s cubic-bezier(.23,1,.32,1) both;transition:.2s}.card:hover{transform:translateY(-2px);border-color:rgba(232,121,97,.38);box-shadow:0 10px 25px rgba(35,61,82,.08)}.idx{color:#82999d;border-right:1px solid rgba(35,61,82,.15);padding:22px 15px;text-align:right;font-size:11px;background:linear-gradient(90deg,rgba(218,232,234,.38),transparent);position:relative}.idx:after{content:"";position:absolute;right:-1px;top:19px;bottom:19px;width:2px;background:rgba(232,121,97,.55)}.body{padding:20px 23px 16px;min-width:0;position:relative}.body:before{content:"";position:absolute;top:21px;right:23px;width:7px;height:7px;border:1px solid rgba(232,121,97,.45);border-radius:50%}.meta{display:flex;gap:8px;align-items:center;margin-bottom:9px}.meta-cat{color:#7f9698;font-size:10px}.level{padding:3px 7px;border-radius:99px;font-size:10px}.simple{background:#e4f1eb;color:#4c8674}.medium{background:#e9eff4;color:#5b7691}.hard{background:#f7e5df;color:#bc705c}.body h3{color:#263f55;font:600 17px/1.55 Manrope,"Noto Sans SC",sans-serif;margin:0;letter-spacing:-.02em}.toggle{display:inline-flex;align-items:center;gap:5px;margin-top:15px;border:0;background:transparent;color:#e87961;padding:0;font-size:11px;font-weight:800}.answer{margin-top:17px;padding:17px 18px;border-left:3px solid #e87961;background:#f7f5ec;animation:fade .22s ease both}.answer-label{color:#d26f59;font-size:10px;font-weight:800;letter-spacing:.08em}.answer p{margin:8px 0 0;color:#647b82;font-size:14px;line-height:1.82}.empty{display:grid;place-items:center;text-align:center;min-height:330px;color:#8ca0a2}.empty h3{color:#213b55;font:600 23px Fraunces,serif}.empty button{border:0;background:#213b55;color:#f8f7ee;padding:9px 14px;border-radius:6px;font-size:12px}.footer{display:flex;justify-content:space-between;margin-top:52px;border-top:1px solid rgba(35,61,82,.12);padding-top:17px;color:#a0aeaa;font-size:10px}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-width:900px){.header-inner{padding:0 24px}.layout{display:block}.sidebar{padding:27px 24px 22px;border-right:0;border-bottom:1px solid rgba(35,61,82,.12)}.intro p{max-width:520px}.nav{margin-top:28px}.nav-label{display:none}.nav{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.cat{flex:0 0 auto;width:auto;padding:8px 11px;background:rgba(223,233,232,.55);border-radius:99px;gap:9px}.cat:hover{transform:none}.cat.active{background:#213b55;color:#fffdf6}.pin{display:none}.count{color:inherit;opacity:.65}.note{display:none}.main{padding:38px 24px 32px}}@media(max-width:620px){.header{height:68px}.header-inner{padding:0 18px}.status{display:none}.menu{display:block}.sidebar{display:none}.sidebar.open{display:block}.intro h1{font-size:27px}.main{padding:30px 16px 24px}.command{padding:18px 15px 10px;border-radius:11px}.command-top{display:block;padding-bottom:14px}.hint{display:block;margin-top:7px}.heading{align-items:center;padding-bottom:21px}.heading h2{font-size:33px}.stat{flex-direction:column;gap:2px;align-items:end}.stat strong{font-size:24px}.toolbar{display:block;padding-top:17px}.levels{margin-top:9px;overflow-x:auto;width:max-content;max-width:100%}.card{grid-template-columns:43px minmax(0,1fr);border-radius:9px}.idx{padding:19px 9px;font-size:10px}.body{padding:17px 15px 14px}.body h3{font-size:15px;line-height:1.65}.answer{padding:14px}.answer p{font-size:13px;line-height:1.8}.footer{display:block;line-height:1.8}.footer span{display:block}}

<script>
const QUESTIONS = [{"id":0,"question":"什么是 Spring Boot？","category":"Spring Boot","answer":"Spring Boot 是基于 Spring 的快速开发框架，通过自动配置、起步依赖和嵌入式容器简化 Spring 应用的创建、配置和部署，使开发者能够以较少配置快速构建可独立运行的生产级应用。"},{"id":1,"question":"说说 Springboot 的启动流程？","category":"Spring Boot","answer":"启动时先执行 main 方法并调用 SpringApplication.run，然后创建并准备 SpringApplication，推断应用类型，加载初始化器和监听器，发布启动事件，创建并刷新 ApplicationContext，解析配置类和自动配置、扫描注册 Bean，启动嵌入式 Web 容器，最后发布应用启动完成事件。"},{"id":2,"question":"Spring Boot 的核心特性有哪些？","category":"Spring Boot","answer":"核心特性包括自动配置、起步依赖、嵌入式 Web 容器、外部化配置、生产级监控能力和无代码生成的快速开发；同时支持独立运行、统一依赖管理、健康检查、指标采集及多环境配置。"},{"id":3,"question":"Spring Boot 是如何通过 main 方法启动 web 项目的？","category":"Spring Boot","answer":"main 方法调用 SpringApplication.run，Spring Boot 根据 classpath 推断 Web 应用类型，创建 WebApplicationContext，加载主配置类及自动配置类，注册 Web 组件并启动嵌入式 Tomcat、Jetty 或 Undertow，最终应用通过内置服务器监听端口并对外提供服务。"},{"id":4,"question":"SpringBoot 是如何实现自动配置的？","category":"Spring Boot","answer":"自动配置由 @EnableAutoConfiguration 启用，Spring Boot 根据条件注解、classpath 中的依赖、配置属性和已注册 Bean，加载 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 中的自动配置类；只有满足条件时才创建默认 Bean，用户自定义 Bean 通常会覆盖默认配置。"},{"id":5,"question":"Spring Boot 支持哪些嵌入 Web 容器？","category":"Spring Boot","answer":"Spring Boot 主要支持嵌入式 Tomcat、Jetty 和 Undertow；Spring Boot 2.x 默认使用 Tomcat，WebFlux 项目通常使用 Reactor Netty，也可以根据依赖替换为其他支持的服务器。"},{"id":6,"question":"Spring Boot 中 application.properties 和 application.yml 的区别是什么？","category":"Spring Boot","answer":"两者都是 Spring Boot 的外部化配置文件，功能基本相同；properties 使用键值对和点号表达层级，直观但层级多时较冗长，yml 使用缩进表达层级，结构更清晰且适合复杂配置，但必须严格遵守 YAML 缩进和类型规则。"},{"id":7,"question":"如何在 Spring Boot 中定义和读取自定义配置？","category":"Spring Boot","answer":"可以在 application.yml 或 properties 中定义配置，然后使用 @Value 读取单个属性，或使用 @ConfigurationProperties 将同一前缀的配置绑定到 Java Bean；配置类通常配合 @Component 或 @EnableConfigurationProperties 注册，并可通过环境变量和启动参数覆盖。"},{"id":8,"question":"Spring Boot 配置文件加载优先级你知道吗？","category":"Spring Boot","answer":"Spring Boot 遵循外部配置优先原则，通常优先级从低到高依次是默认配置、classpath 根目录配置、classpath 的 profile 配置、当前目录配置、当前目录 profile 配置、环境变量、系统属性、命令行参数和测试注解配置；高优先级配置会覆盖低优先级同名配置，具体顺序以对应版本文档为准。"},{"id":9,"question":"Spring Boot 打成的 jar 和普通的 jar 有什么区别 ?","category":"Spring Boot","answer":"普通 jar 主要存放编译后的类和资源，通常需要外部容器或完整 classpath 才能运行；Spring Boot jar 是可执行 jar，通常包含应用类、依赖包和启动加载器，可通过 java -jar 直接运行，并且依赖通常放在 BOOT-INF/lib 目录中。"},{"id":10,"question":"Spring Boot 是否可以使用 XML 配置 ?","category":"Spring Boot","answer":"可以，Spring Boot 支持通过 @ImportResource 加载 XML Bean 配置，也可以使用传统 XML 配置文件与 Java Config 混合使用；不过官方更推荐 Java Config、注解和自动配置，因为它们类型安全、可维护性更好。"},{"id":11,"question":"SpringBoot 默认同时可以处理的最大请求数是多少？","category":"Spring Boot","answer":"Spring Boot 没有统一固定的最大请求数，默认并发能力主要由嵌入式容器线程池和连接队列决定，例如 Tomcat 的最大工作线程数和 accept queue；实际并发还受 CPU、内存、接口耗时、数据库连接池和网络条件影响，应通过 server.tomcat.threads.max 等配置和压测确定。"},{"id":12,"question":"如何理解 Spring Boot 中的 starter？","category":"Spring Boot","answer":"starter 是 Spring Boot 提供的依赖聚合模块，用于将某一功能所需的相关依赖和兼容版本集中管理，例如 spring-boot-starter-web；引入 starter 后通常无需逐个配置依赖，配合自动配置即可快速启用对应能力。"},{"id":13,"question":"Spring Boot 如何处理跨域请求（CORS）？","category":"Spring Boot","answer":"可以在 Controller 或方法上使用 @CrossOrigin 局部配置跨域，也可以实现 WebMvcConfigurer 并重写 addCorsMappings 进行全局配置；如果使用 Spring Security，还需要在安全配置中启用 cors，并正确设置允许的来源、方法、请求头及是否允许凭证。"},{"id":14,"question":"在 Spring Boot 中你是怎么使用拦截器的？","category":"Spring Boot","answer":"先实现 HandlerInterceptor，在 preHandle、postHandle 或 afterCompletion 中编写认证、日志和耗时统计逻辑，再实现 WebMvcConfigurer 的 addInterceptors 注册拦截器，并通过 addPathPatterns 和 excludePathPatterns 配置拦截与排除路径；拦截器适合处理控制器层面的通用逻辑。"},{"id":15,"question":"SpringBoot 中如何实现定时任务 ?","category":"Spring Boot","answer":"在启动类或配置类上添加 @EnableScheduling，在需要定时执行的方法上使用 @Scheduled 配置 fixedRate、fixedDelay 或 cron 表达式；生产环境还应考虑线程池、分布式部署下的重复执行、任务幂等性和失败重试问题。"},{"id":16,"question":"什么是 Spring Actuator？它有什么优势？","category":"Spring Boot","answer":"Spring Actuator 是 Spring Boot 的生产监控组件，通过 health、metrics、info、loggers 等端点暴露应用运行状态、健康信息和指标；它能降低监控接入成本，便于健康检查、故障排查和运维自动化，但必须严格限制端点暴露范围并配置访问控制。"},{"id":17,"question":"Spring Boot 2.x 与 1.x 版本有哪些主要的改进和区别？","category":"Spring Boot","answer":"Spring Boot 2.x 基于 Spring Framework 5，通常要求 Java 8 及以上，升级了嵌入式容器和依赖版本，增强了 WebFlux 响应式开发、Actuator 端点、配置绑定和数据访问能力，并对安全、性能及依赖管理进行了改进，同时存在部分配置属性和 API 的兼容性变化。"},{"id":18,"question":"Spring Boot 3.x 与 2.x 版本有哪些主要的改进和区别？","category":"Spring Boot","answer":"Spring Boot 3.x 基于 Spring Framework 6，最低要求 Java 17，并全面迁移到 Jakarta EE 命名空间，将 javax.* 改为 jakarta.*；同时升级到 Hibernate 6、改进可观测性和 Micrometer 支持、增强 AOT 与 Native Image 能力，并移除了部分旧 API，因此升级时要重点检查 JDK、依赖版本、导入包和配置兼容性。"},{"id":19,"question":"说说你对 Spring Boot 事件机制的了解？","category":"Spring Boot","answer":"Spring 事件机制基于 ApplicationEvent、ApplicationEventPublisher 和 @EventListener，发布者只负责发布事件，监听器异步或同步处理业务，从而实现模块解耦；Spring Boot 还会在启动、准备完成和关闭等阶段发布生命周期事件，监听器可以通过条件、顺序和事务事件配置执行时机。"},{"id":20,"question":"在 Spring Boot 中如何实现多数据源配置？","category":"Spring Boot","answer":"分别配置多个 DataSource、事务管理器和数据访问层，使用 @ConfigurationProperties 绑定各数据源参数，并通过 @Primary 指定默认数据源；在 JPA 中通常为每个数据源配置 EntityManagerFactory、Repository 扫描路径和 JpaTransactionManager，在 MyBatis 中则分别配置 SqlSessionFactory 和 Mapper 扫描。"},{"id":21,"question":"Spring Boot 中如何实现异步处理？","category":"Spring Boot","answer":"在配置类上添加 @EnableAsync，在方法上添加 @Async，Spring 会通过代理将方法提交到异步线程池执行；推荐自定义 ThreadPoolTaskExecutor，合理设置核心线程数、最大线程数和队列容量，并通过 Future、CompletableFuture 或异常处理器获取结果和处理异常。"},{"id":22,"question":"如何在 SpringBoot 启动时执行特定代码？有哪些方式？","category":"Spring Boot","answer":"常用方式包括实现 CommandLineRunner 或 ApplicationRunner，在容器启动完成后执行初始化逻辑；也可以使用 @PostConstruct、ApplicationReadyEvent 监听器或自定义 SmartInitializingSingleton，具体选择取决于是否需要命令行参数、是否要求所有组件和 Web 服务完全就绪，以及是否需要控制执行顺序。"},{"id":23,"question":"SpringBoot（Spring）中为什么不推荐使用 @Autowired ？","category":"Spring Boot","answer":"并不是禁止使用 @Autowired，而是不推荐字段注入，因为它隐藏依赖、难以进行单元测试、可能导致对象处于不完整状态且不利于不可变设计；更推荐构造器注入，它能显式声明依赖、支持 final 字段、便于测试，并在依赖缺失时尽早失败。"},{"id":24,"question":"@Async 什么时候会失效？","category":"Spring Boot","answer":"常见失效原因包括未启用 @EnableAsync、方法不是 Spring Bean 的 public 方法、同类内部直接调用绕过代理、对象通过 new 创建、异常未正确处理，以及线程池配置或事务上下文使用不当；解决方案是通过 Spring 注入的代理对象调用，并检查注解、代理方式和线程池配置。"},{"id":25,"question":"Spring Boot 工程启动以后，我希望将数据库中已有的固定内容，打入到 Redis 缓存中，请问如何处理？","category":"Spring Boot","answer":"可以实现 CommandLineRunner 或 ApplicationRunner，在应用启动并完成 Bean 初始化后查询数据库，再使用 RedisTemplate 批量写入缓存；实际实现应设置合理的 key、序列化方式和过期时间，保证初始化逻辑幂等，并结合数据量使用批量操作，避免阻塞启动过程或造成数据库与 Redis 压力过大。"},{"id":26,"question":"什么是循环依赖（常问）？","category":"Spring","answer":"循环依赖是指多个 Bean 之间相互依赖形成闭环，例如 A 依赖 B、B 又依赖 A；在单例 Bean 的属性注入场景下，Spring 可通过三级缓存提前暴露对象引用解决部分循环依赖，但构造器循环依赖、prototype 作用域循环依赖通常无法自动解决。"},{"id":27,"question":"Spring 如何解决循环依赖？","category":"Spring","answer":"Spring 主要通过三级缓存解决单例属性注入的循环依赖：创建 Bean A 时先将其提前暴露到三级缓存，实例化并填充 A 时发现依赖 B，创建 B 时再从缓存中获取 A 的早期引用完成注入，B 创建完成后回到 A；构造器注入形成的循环无法依靠该机制解决。"},{"id":28,"question":"为什么 Spring 循环依赖需要三级缓存，二级不够吗？","category":"Spring","answer":"三级缓存不仅保存早期 Bean 引用，还保存 ObjectFactory，用于在需要时通过 SmartInstantiationAwareBeanPostProcessor 创建代理对象；二级缓存只能直接保存早期对象，无法保证循环依赖场景下提前暴露的对象与最终代理对象一致，因此需要三级缓存延迟决定是返回原对象还是代理对象。"},{"id":29,"question":"看过源码吗？说下 Spring 由哪些重要的模块组成？","category":"Spring","answer":"Spring 主要包含 Core Container、AOP、Data Access、Web、Messaging、Test 等模块；Core Container 提供 IoC 和依赖注入，AOP 提供面向切面能力，Data Access 支持事务与 JDBC、ORM，Web 支持 MVC 和 WebFlux，Test 提供集成测试与模拟测试能力。"},{"id":30,"question":"什么是 Spring IOC？","category":"Spring","answer":"IoC 即控制反转，是一种将对象创建、依赖关系维护和生命周期管理交给 Spring 容器负责的设计思想；应用程序通过配置或注解声明依赖，由容器实例化 Bean 并注入依赖，从而降低对象之间的耦合。"},{"id":31,"question":"Spring IOC 有什么好处？","category":"Spring","answer":"IoC 能集中管理对象和依赖关系，降低组件耦合，支持面向接口编程和依赖替换，便于单元测试、扩展和维护；同时容器还能统一处理 Bean 的生命周期、作用域、代理和配置。"},{"id":32,"question":"Spring 中的 DI 是什么？","category":"Spring","answer":"DI 即依赖注入，是 IoC 的具体实现方式，指对象不主动创建依赖，而由 Spring 容器将依赖对象注入其中；常见方式包括构造器注入、Setter 注入和字段注入，其中通常推荐构造器注入。"},{"id":33,"question":"什么是 Spring Bean？","category":"Spring","answer":"Spring Bean 是由 Spring IoC 容器创建、组装、配置并管理生命周期的对象；它可以通过组件扫描、@Bean、XML 或编程方式注册，容器根据 BeanDefinition 决定其创建方式、作用域、依赖关系和初始化销毁逻辑。"},{"id":34,"question":"Spring 中的 BeanFactory 是什么？","category":"Spring","answer":"BeanFactory 是 Spring IoC 容器的基础接口，提供 Bean 的定义、创建、获取和依赖注入等核心能力，默认采用延迟初始化；ApplicationContext 在 BeanFactory 基础上增加了事件发布、国际化、资源加载和自动识别后处理器等企业级功能。"},{"id":35,"question":"Spring 中的 FactoryBean 是什么？","category":"Spring","answer":"FactoryBean 是一种特殊的 Bean 接口，用于自定义复杂对象的创建过程；从容器获取该 Bean 时默认得到的是 FactoryBean#getObject 返回的对象，如需获取工厂本身则使用以 & 开头的 Bean 名称。"},{"id":36,"question":"Spring 中的 ObjectFactory 是什么？","category":"Spring","answer":"ObjectFactory 是一个延迟获取对象的回调接口，调用 getObject 时才从容器中获取目标对象，常用于延迟依赖、处理作用域对象或避免初始化时机问题；ObjectProvider 是其更强大的扩展，支持可选获取和流式操作。"},{"id":37,"question":"Spring 中的 ApplicationContext 是什么？","category":"Spring","answer":"ApplicationContext 是 Spring 的高级 IoC 容器，继承并扩展 BeanFactory，除 Bean 创建和依赖注入外，还提供事件发布、国际化、资源访问、环境配置、自动注册后处理器等能力，是实际应用中最常用的容器接口。"},{"id":38,"question":"Spring Bean 一共有几种作用域？","category":"Spring","answer":"常用作用域包括 singleton、prototype、request、session、application 和 websocket，其中 singleton 是默认作用域，每个容器一个实例；request、session、application 和 websocket 主要用于 Web 环境，prototype 每次获取都会创建新实例。"},{"id":39,"question":"Spring 一共有几种注入方式？","category":"Spring","answer":"Spring 常见注入方式有构造器注入、Setter 注入和字段注入，也可以通过方法参数、接口回调或 @Autowired 方法注入；实际开发通常优先使用构造器注入，因为依赖明确、对象可保持不可变且更便于测试。"},{"id":40,"question":"什么是 AOP？","category":"Spring","answer":"AOP 即面向切面编程，它将日志、事务、权限、监控等横切关注点从核心业务中分离出来，通过切点匹配目标方法并在调用前后织入增强逻辑，从而减少重复代码并提高模块化程度。"},{"id":41,"question":"Spring AOP默认用的是什么动态代理，两者的区别？","category":"Spring","answer":"Spring AOP 默认在目标类实现接口时使用 JDK 动态代理，否则使用 CGLIB 代理；JDK 代理基于接口生成代理对象，CGLIB 通过继承目标类生成子类代理，不能代理 final 类或 final 方法，Spring Boot 2.x 及之后也可通过配置统一使用 CGLIB。"},{"id":42,"question":"能说说 Spring 拦截链的实现吗？","category":"Spring","answer":"Spring AOP 会将匹配目标方法的通知转换为 MethodInterceptor，并按顺序组织成拦截器链；代理对象调用方法时先进入 ReflectiveMethodInvocation，通过递归或迭代执行各个拦截器，最终调用目标方法，再按逆序返回并执行后置逻辑。"},{"id":43,"question":"Spring AOP 和 AspectJ 有什么区别？","category":"Spring","answer":"Spring AOP 基于运行时代理，只能拦截 Spring Bean 的方法调用，使用简单且轻量；AspectJ 属于编译期或类加载期织入，支持构造器、字段访问和非 Spring 对象等更广泛的连接点，但配置和构建成本更高。"},{"id":44,"question":"说下 Spring Bean 的生命周期？","category":"Spring","answer":"Bean 生命周期通常包括实例化、属性注入、Aware 接口回调、BeanPostProcessor 前置处理、初始化方法、BeanPostProcessor 后置处理并正式投入使用，容器关闭时再执行销毁方法；实际流程会因作用域、是否实现相关接口及代理处理而有所差异。"},{"id":45,"question":"说下对 Spring MVC 的理解？","category":"Spring","answer":"Spring MVC 是基于 Servlet 的请求驱动 Web 框架，采用 MVC 思想将请求处理、业务模型和视图展示分离；它通过 DispatcherServlet 统一接收请求，再借助处理器映射、适配器、参数解析器、消息转换器和异常处理器完成请求分发与响应返回。"},{"id":46,"question":"Spring MVC 具体的工作原理？","category":"Spring","answer":"请求首先进入 DispatcherServlet，随后由 HandlerMapping 找到处理器，再由 HandlerAdapter 调用 Controller；返回结果经过视图解析器渲染，或由 HttpMessageConverter 序列化为响应体，过程中还会经过拦截器、参数解析器和统一异常处理器。"},{"id":47,"question":"SpringMVC 父子容器是什么知道吗？","category":"Spring","answer":"传统 Spring MVC 中通常由 ContextLoaderListener 创建父容器，管理业务层、数据层等 Bean，DispatcherServlet 创建子容器，管理 Controller、HandlerMapping 等 Web Bean；子容器可以访问父容器 Bean，父容器不能访问子容器 Bean，以此实现分层管理。"},{"id":48,"question":"你了解的 Spring 都用到哪些设计模式？","category":"Spring","answer":"Spring 中常见设计模式包括工厂模式创建 Bean，单例模式管理默认作用域，代理模式实现 AOP，模板方法模式体现在 JdbcTemplate，观察者模式实现事件机制，策略模式用于资源和处理器选择，适配器模式用于统一调用不同类型的 Controller。"},{"id":49,"question":"Spring 事务有几个隔离级别？","category":"Spring","answer":"Spring 支持 READ_UNCOMMITTED、READ_COMMITTED、REPEATABLE_READ、SERIALIZABLE 四种标准隔离级别，并提供 DEFAULT 使用数据库默认级别；隔离级别越高并发一致性越强，但通常会带来更大的锁竞争和性能开销。"},{"id":50,"question":"Spring 有哪几种事务传播行为?","category":"Spring","answer":"Spring 常见事务传播行为有 REQUIRED、SUPPORTS、MANDATORY、REQUIRES_NEW、NOT_SUPPORTED、NEVER 和 NESTED；它们决定当前方法有事务时如何加入、挂起、创建新事务或拒绝执行，其中 REQUIRED 是默认行为。"},{"id":51,"question":"Spring 事务传播行为有什么用?","category":"Spring","answer":"事务传播行为用于规定嵌套业务调用之间如何共享或创建事务，例如 REQUIRED 让多个方法加入同一事务，REQUIRES_NEW 创建独立事务，NESTED 使用保存点实现嵌套回滚；合理选择可以明确业务边界和异常回滚范围。"},{"id":52,"question":"Spring 的优点","category":"Spring","answer":"Spring 的主要优点是 IoC 降低耦合，AOP 便于处理横切逻辑，模块化设计支持按需使用，声明式事务简化事务管理，并且生态完善、扩展性强、测试友好，能够提升企业应用的开发效率和可维护性。"},{"id":53,"question":"Spring AOP 相关术语都有哪些？","category":"Spring","answer":"核心术语包括 Aspect 切面、Join Point 连接点、Pointcut 切点、Advice 通知、Target 目标对象、Proxy 代理对象和 Weaving 织入；切面描述横切逻辑，切点定义匹配范围，通知定义在何时执行增强代码。"},{"id":54,"question":"Spring 通知有哪些类型？","category":"Spring","answer":"Spring AOP 通知主要包括前置通知 @Before、后置通知 @After、返回通知 @AfterReturning、异常通知 @AfterThrowing 和环绕通知 @Around；环绕通知能力最强，可以控制目标方法是否执行、修改参数和返回值，但应谨慎使用。"},{"id":55,"question":"Spring IOC 容器初始化过程？","category":"Spring","answer":"容器初始化时先加载和解析配置，生成 BeanDefinition 并注册到 BeanDefinitionRegistry，随后执行 BeanFactoryPostProcessor 修改 BeanDefinition，注册 BeanPostProcessor，实例化并依赖注入非懒加载单例 Bean，执行初始化和代理处理，最后发布容器刷新完成事件。"},{"id":56,"question":"Spring Bean 注册到容器有哪些方式？","category":"Spring","answer":"常见方式包括使用 @Component、@Service、@Controller、@Repository 配合组件扫描，使用配置类中的 @Bean 方法，使用 XML Bean 定义，使用 @Import 导入配置或组件，以及通过 BeanDefinitionRegistry 编程式注册。"},{"id":57,"question":"Spring 自动装配的方式有哪些？","category":"Spring","answer":"自动装配可以按类型、按名称或构造器进行，注解方式常用 @Autowired、@Qualifier、@Resource、@Primary 和构造器注入；Spring Boot 还会通过条件注解和自动配置机制，根据环境与依赖自动创建符合条件的 Bean。"},{"id":58,"question":"@Qualifier 注解有什么作用","category":"Spring","answer":"当容器中存在多个同类型 Bean 时，@Qualifier 用于指定要注入的 Bean 名称或限定符，解决按类型注入的不唯一问题；它通常与 @Autowired 或构造器参数配合使用，也可以配合自定义限定注解实现更清晰的依赖选择。"},{"id":59,"question":"@Bean和@Component有什么区别？","category":"Spring","answer":"@Component 标注在类上，由组件扫描自动发现并注册该类，适合管理自己编写的组件；@Bean 标注在配置类的方法上，方法返回值作为 Bean 注册，适合注册第三方类或需要精细控制实例化过程的对象。"},{"id":60,"question":"@Component、@Controller、@Repository和@Service 的区别？","category":"Spring","answer":"它们都属于组件注解，默认都会被扫描并注册为 Bean；@Component 是通用组件，@Controller 表示 MVC 控制器，@Service 表示业务层，@Repository 表示数据访问层并可参与持久化异常转换，后三者主要用于语义分层和框架特定处理。"},{"id":61,"question":"Spring 事务在什么情况下会失效？","category":"Spring","answer":"常见原因包括方法不是 public、同类内部调用绕过代理、对象通过 new 创建、异常被捕获未抛出、抛出非默认回滚异常、数据库引擎不支持事务、事务注解配置错误以及异步线程导致事务上下文不传递；排查时应重点确认代理、异常和数据源配置。"},{"id":62,"question":"说说 Spring 启动过程？","category":"Spring","answer":"Spring 启动通常从创建 ApplicationContext 开始，读取配置并注册 BeanDefinition，执行 BeanFactoryPostProcessor 和 BeanDefinitionRegistryPostProcessor，注册 BeanPostProcessor，实例化非懒加载单例并完成依赖注入和初始化，最后发布 ContextRefreshedEvent 表示容器刷新完成。"},{"id":63,"question":"Spring 的单例 Bean 是否有并发安全问题？","category":"Spring","answer":"单例 Bean 只保证容器中实例唯一，并不保证线程安全；如果 Bean 内部保存可变实例字段且被多个请求同时修改，就可能产生并发问题。无状态 Bean 通常天然安全，有状态场景应避免共享可变数据或使用局部变量、并发容器和必要的同步机制。"},{"id":64,"question":"Spring中的@Primary注解的作用是什么？","category":"Spring","answer":"@Primary 用于多个同类型 Bean 同时满足按类型注入时指定一个默认候选者；它只能解决默认选择问题，不能替代 @Qualifier，当调用方需要明确指定其他 Bean 时仍可使用 @Qualifier 覆盖默认优先级。"},{"id":65,"question":"Spring中的@Value注解的作用是什么？","category":"Spring","answer":"@Value 用于将配置文件、环境变量或 SpEL 表达式的值注入字段、方法或构造器参数，例如读取数据库地址或设置默认值；它适合少量配置，批量且结构化配置更推荐使用 @ConfigurationProperties。"},{"id":66,"question":"Spring 中的 @Profile 注解的作用是什么？","category":"Spring","answer":"@Profile 用于根据当前激活的环境配置决定是否注册某个 Bean 或配置类，例如为 dev、test 和 prod 定义不同数据源；可通过 spring.profiles.active 激活环境，也可设置默认 profile。"},{"id":67,"question":"Spring 中的 @PostConstruct 和 @PreDestroy 注解的作用是什么？","category":"Spring","answer":"@PostConstruct 标注的方法会在依赖注入完成后、Bean 正式使用前执行，适合初始化资源；@PreDestroy 标注的方法会在容器关闭、Bean 销毁前执行，适合释放资源；方法通常应无参数且不能依赖尚未初始化的其他资源。"},{"id":68,"question":"Spring 中的 @RequestBody 和 @ResponseBody 注解的作用是什么？","category":"Spring","answer":"@RequestBody 将 HTTP 请求体通过 HttpMessageConverter 反序列化为 Java 对象，常用于接收 JSON；@ResponseBody 将方法返回值通过消息转换器序列化到响应体，常用于返回 JSON，@RestController 相当于类上同时使用 @Controller 和 @ResponseBody。"},{"id":69,"question":"Spring 中的 @PathVariable 注解的作用是什么？","category":"Spring","answer":"@PathVariable 用于获取 URL 路径模板中的变量，例如 /users/{id} 中的 id，并绑定到方法参数；它适合表达资源标识，参数名可以显式指定，必要时还可设置是否必需和类型转换规则。"},{"id":70,"question":"Spring中的 @ModelAttribute 注解的作用是什么？","category":"Spring","answer":"@ModelAttribute 可以将请求参数绑定到模型对象，也可以将方法返回值加入 Model，常用于表单数据接收和公共模型数据准备；在 Controller 中使用时，Spring 会进行数据绑定、类型转换和校验。"},{"id":71,"question":"Spring 中的 @ExceptionHandler 注解的作用是什么？","category":"Spring","answer":"@ExceptionHandler 用于在 Controller 或 @ControllerAdvice 中声明异常处理方法，将指定异常转换为统一响应；局部处理只作用于当前控制器，全局处理适合统一处理业务异常、参数校验异常和系统异常。"},{"id":72,"question":"Spring 中的 @ResponseStatus 注解的作用是什么？","category":"Spring","answer":"@ResponseStatus 用于指定 Controller 方法或异常对应的 HTTP 状态码和原因信息；它可以直接标注在方法或自定义异常类上，但复杂项目通常更推荐通过统一异常处理器集中构造响应。"},{"id":73,"question":"Spring 中的 @RequestHeader 和 @CookieValue 注解的作用是什么？","category":"Spring","answer":"@RequestHeader 用于读取 HTTP 请求头，例如 Authorization 和 User-Agent；@CookieValue 用于读取指定 Cookie 值，两者都支持显式指定名称、是否必需和默认值，常用于认证信息、链路追踪和客户端参数获取。"},{"id":74,"question":"Spring 中的 @SessionAttribute 注解的作用是什么？","category":"Spring","answer":"@SessionAttribute 用于读取已经存在于 HTTP Session 中的属性，并绑定到控制器方法参数；它适合获取由其他流程写入的会话数据，如果需要创建或修改 Session 属性，则可使用 HttpSession 或 @SessionAttributes。"},{"id":75,"question":"Spring 中的 @Validated 和 @Valid 注解有什么区别？","category":"Spring","answer":"两者都用于触发 Bean Validation 校验，@Valid 属于 Jakarta Validation 标准，主要支持级联校验但不支持校验分组；@Validated 是 Spring 提供的扩展，支持分组校验，也常用于方法级校验，实际项目可按是否需要分组选择。"},{"id":76,"question":"Spring 中的 @Scheduled 注解的作用是什么？","category":"Spring","answer":"@Scheduled 用于声明定时任务，可通过 cron、fixedRate 或 fixedDelay 设置执行规则；使用前需要启用 @EnableScheduling，生产环境还应配置任务线程池，避免任务重叠、重复执行，并保证任务具备幂等性。"},{"id":77,"question":"Spring 中的 @Cacheable 和 @CacheEvict 注解的作用是什么？","category":"Spring","answer":"@Cacheable 在方法执行前根据参数查询缓存，命中则直接返回，否则执行方法并写入缓存；@CacheEvict 用于删除指定缓存或清空缓存，常在新增、修改和删除数据后使用，以避免缓存与数据库不一致。"},{"id":78,"question":"Spring 中的 @Conditional 注解的作用是什么？","category":"Spring","answer":"@Conditional 用于根据条件决定是否注册 Bean 或配置类，条件可以检查类路径、Bean、属性、环境、资源等；Spring Boot 的自动配置大量使用条件注解，以实现根据依赖和配置动态启用功能。"},{"id":79,"question":"Spring 中的 @Lazy 注解的作用是什么？","category":"Spring","answer":"@Lazy 用于延迟初始化 Bean，使其不在容器启动时创建，而是在第一次被获取或使用时创建；它可以缩短启动时间、减少不必要的资源占用，但可能将初始化异常推迟到运行阶段。"},{"id":80,"question":"Spring 中的 @PropertySource 注解的作用是什么？","category":"Spring","answer":"@PropertySource 用于将指定 properties 文件加载到 Spring Environment 中，之后可以通过 @Value 或 Environment 读取；它默认主要支持 properties 格式，YAML 文件通常需要通过配置文件机制或自定义 PropertySourceFactory 处理。"},{"id":81,"question":"Spring 中的 JPA 和 Hibernate 有什么区别？","category":"Spring","answer":"JPA 是 Java 持久化规范，定义实体映射、EntityManager 和查询等标准接口；Hibernate 是实现 JPA 的 ORM 框架之一，并提供额外的缓存、批量处理和扩展特性，Spring Data JPA 则进一步简化了基于 JPA 的 Repository 开发。"},{"id":82,"question":"Spring 中的 @EventListener 注解的作用是什么？","category":"Spring","answer":"@EventListener 用于将方法注册为 Spring 事件监听器，当容器发布匹配事件时自动调用该方法；它支持指定事件类型、条件和执行顺序，配合 @TransactionalEventListener 还可以根据事务提交或回滚阶段处理事件。"},{"id":83,"question":"@Async 注解的原理是什么？","category":"Spring","answer":"@Async 通过 Bean 后置处理器为目标 Bean 创建代理，调用被注解方法时由代理将任务提交到配置的 TaskExecutor 线程池，从而异步执行；返回值可以是 void、Future 或 CompletableFuture，异常处理和线程池隔离需要单独配置。"},{"id":84,"question":"Spring 和 Spring MVC 的关系是什么？","category":"Spring","answer":"Spring 是提供 IoC、AOP、事务和数据访问等能力的基础框架，Spring MVC 是 Spring 生态中的 Web 框架模块，专门处理 HTTP 请求和 MVC 分层；Spring MVC 依赖 Spring Core 容器，但 Spring 本身并不局限于 Web 开发。"},{"id":85,"question":"Spring WebFlux 是什么？它与 Spring MVC 有何不同？","category":"Spring","answer":"Spring WebFlux 是基于 Reactor 的响应式 Web 框架，支持非阻塞 I/O 和背压，适合高并发、I/O 密集型场景；Spring MVC 基于 Servlet 的同步阻塞模型，生态更成熟、编程方式更直观，WebFlux 只有在上下游都采用非阻塞模型时才能充分发挥优势。"},{"id":86,"question":"介绍下 Spring MVC 的核心组件？","category":"Spring","answer":"核心组件包括 DispatcherServlet、HandlerMapping、HandlerAdapter、Controller、HandlerInterceptor、ViewResolver、LocaleResolver、HandlerExceptionResolver 和 HttpMessageConverter；它们分别负责请求入口、处理器查找与调用、拦截、视图解析、国际化、异常处理及消息转换。"},{"id":87,"question":"什么是 Restful 风格的接口？","category":"Spring","answer":"RESTful 是以资源为中心设计 Web 接口的风格，使用 URI 表示资源，使用 GET、POST、PUT、PATCH、DELETE 等 HTTP 方法表达查询、创建、更新和删除，并通过状态码和统一表示传递结果；良好设计还应保持无状态、幂等性和语义清晰。"},{"id":88,"question":"Spring MVC中的Controller是什么？如何定义一个Controller？","category":"Spring","answer":"Controller 是 Spring MVC 中接收请求、调用业务服务并返回视图或响应数据的控制层组件；通常在类上添加 @Controller 或 @RestController，在方法上使用 @RequestMapping、@GetMapping 等映射注解定义请求路径和处理逻辑。"},{"id":89,"question":"Spring MVC 中如何处理表单提交？","category":"Spring","answer":"可以在 Controller 方法中使用 @ModelAttribute 接收表单字段并绑定到 Java 对象，使用 @RequestParam 接收单个参数，再配合 @Valid 或 @Validated 进行校验；处理成功后返回视图或执行重定向，校验失败则将 BindingResult 中的错误信息返回页面。"},{"id":90,"question":"Spring MVC 中的视图解析器有什么作用？","category":"Spring","answer":"视图解析器根据 Controller 返回的逻辑视图名找到实际 View，例如将 user 转换为 /WEB-INF/views/user.jsp；它负责视图名称与模板文件的映射和渲染，前后端分离的 REST 接口通常直接通过消息转换器返回 JSON，不依赖视图解析器。"},{"id":91,"question":"Spring MVC 中的拦截器是什么？如何定义一个拦截器？","category":"Spring","answer":"Spring MVC 拦截器用于在 Controller 执行前后插入通用逻辑，常用于登录校验、日志和权限控制；实现 HandlerInterceptor 的 preHandle、postHandle 或 afterCompletion 方法，再通过 WebMvcConfigurer#addInterceptors 注册并配置拦截路径和排除路径。"},{"id":92,"question":"Spring MVC 中的国际化支持是如何实现的？","category":"Spring","answer":"Spring MVC 通常通过 MessageSource 加载不同 Locale 对应的消息资源文件，再由 LocaleResolver 根据请求参数、请求头或 Cookie 确定当前语言，Controller 或视图通过消息编码获取对应文本；切换语言时只需改变 Locale，不需要修改业务代码。"},{"id":93,"question":"Spring MVC 中如何处理异常？","category":"Spring","answer":"可以使用 Controller 内的 @ExceptionHandler 处理局部异常，使用 @ControllerAdvice 或 @RestControllerAdvice 实现全局统一处理，也可以配合 ResponseEntityExceptionHandler 覆盖框架异常处理方法；生产项目通常统一返回错误码、消息、时间和链路标识。"},{"id":94,"question":"@Async 什么时候会失效？","category":"Spring","answer":"常见原因包括未启用 @EnableAsync、方法不是 public、对象不是 Spring Bean、同类内部调用绕过代理、通过 new 创建对象、异常未正确处理，以及线程池或代理配置不正确；应通过 Spring 注入的代理对象调用，并检查异步配置和返回值处理。"},{"id":95,"question":"@Async 如何避免内部调用失效？","category":"Spring","answer":"内部调用会绕过 Spring 代理，因此 @Async 不会生效；推荐将异步方法拆到另一个 Spring Bean 中并通过注入调用，或注入自身代理后调用，必要时使用 AopContext.currentProxy，但更推荐拆分组件以保持结构清晰并便于测试。"},{"id":96,"question":"在 Spring 中，拦截器和过滤器有什么区别？","category":"Spring","answer":"过滤器属于 Servlet 规范，在请求进入 Spring MVC 前执行，可以处理所有 Servlet 请求；拦截器属于 Spring MVC，只针对进入 DispatcherServlet 的请求并能获取 Handler 信息。过滤器适合编码、跨域和请求包装，拦截器适合登录、权限和控制器调用前后的业务处理。"},{"id":97,"question":"MySQL 中的数据排序是怎么实现的？","category":"MySQL","answer":"MySQL 通常通过索引有序扫描或 filesort 实现排序；如果排序字段符合索引顺序且查询条件可利用索引，就能直接按索引顺序返回，否则会将数据放入 sort buffer 进行内存排序，数据量过大时还可能产生磁盘临时文件。"},{"id":98,"question":"详细描述一条 SQL 语句在 MySQL 中的执行过程。","category":"MySQL","answer":"客户端发送 SQL 后，MySQL 依次进行连接认证、解析和预处理、权限校验、优化器生成执行计划，执行器调用存储引擎读取或修改数据，期间使用 Buffer Pool、锁和事务日志，最后将结果集或执行状态返回给客户端。"},{"id":99,"question":"MySQL 的索引类型有哪些？","category":"MySQL","answer":"按数据结构常见有 B+ 树索引、Hash 索引和全文索引，InnoDB 主要使用 B+ 树；按物理组织可分为聚簇索引和二级索引，按字段特性还可分为主键索引、唯一索引、普通索引、联合索引和前缀索引。"},{"id":100,"question":"MySQL 的 Change Buffer 是什么？它有什么作用？","category":"MySQL","answer":"Change Buffer 是 InnoDB 针对非唯一二级索引页的写优化结构，当索引页不在 Buffer Pool 中时，先缓存对该页的修改，避免立即随机读盘，等页面被读取时再合并；它能减少随机 I/O，但不适用于聚簇索引和唯一索引。"},{"id":101,"question":"什么是批量数据入库？相比单条插入有什么优势？","category":"MySQL","answer":"批量入库是一次提交多条数据或使用批量接口写入数据库，相比逐条插入可减少网络往返、事务提交、日志刷盘和锁开销，并提高吞吐量；批量大小应结合事务日志、锁范围、内存和失败重试成本合理设置。"},{"id":102,"question":"什么是数据全量同步和增量同步？它们各有什么优缺点？","category":"MySQL","answer":"全量同步是复制源端全部数据，实施简单且适合初始化，但耗时长、资源消耗大；增量同步只同步新增或变更数据，效率高、实时性好，但依赖可靠的变更标识、日志或 CDC 机制，首次使用通常需要先全量再增量。"},{"id":103,"question":"什么是游标 Cursor 分页？相比传统 LIMIT OFFSET 分页有什么优势？","category":"MySQL","answer":"游标分页根据上一页最后一条记录的排序键继续查询，例如 WHERE id > last_id ORDER BY id LIMIT n；相比 OFFSET 需要跳过大量记录，游标分页无需扫描和丢弃前面数据，深分页性能更稳定，但要求排序键稳定且不能随意跳到任意页。"},{"id":104,"question":"MySQL 的存储引擎有哪些？它们之间有什么区别？","category":"MySQL","answer":"常见引擎包括 InnoDB、MyISAM、Memory 和 Archive，其中 InnoDB 支持事务、行锁、外键和崩溃恢复，是默认引擎；MyISAM 不支持事务但读性能和存储结构较简单，Memory 将数据放内存，Archive 适合高压缩的历史数据写入。"},{"id":105,"question":"MySQL InnoDB 引擎中的聚簇索引和非聚簇索引有什么区别？","category":"MySQL","answer":"InnoDB 的聚簇索引叶子节点直接存放整行数据，通常由主键构成，一张表只有一个；非聚簇索引即二级索引叶子节点存放索引列和主键值，查询非索引列时还需根据主键回聚簇索引取数据。"},{"id":106,"question":"MySQL 中的回表是什么？","category":"MySQL","answer":"回表是通过二级索引找到主键后，再根据主键到聚簇索引中读取完整行数据的过程；如果查询所需字段全部包含在二级索引中，就能使用覆盖索引避免回表，从而减少随机 I/O。"},{"id":107,"question":"MySQL 索引的最左前缀匹配原则是什么？","category":"MySQL","answer":"联合索引按照定义顺序组织，查询通常只能有效使用从最左列开始的连续索引列，例如联合索引(a,b,c)可支持 a、a+b 或 a+b+c，但缺少 a 时通常不能充分利用后续列；遇到范围条件后，后续列的索引利用能力也可能受限。"},{"id":108,"question":"MySQL 的覆盖索引是什么？","category":"MySQL","answer":"覆盖索引是指二级索引已经包含查询所需的全部字段，存储引擎只扫描索引即可返回结果，无需回表读取聚簇索引；它能减少 I/O 和随机访问，但索引过宽会增加写入、存储和维护成本。"},{"id":109,"question":"MySQL 的索引下推是什么？","category":"MySQL","answer":"索引下推 ICP 允许存储引擎在扫描二级索引时就使用部分非索引条件过滤记录，再对通过过滤的记录回表，从而减少回表次数和数据读取量；它通常适用于联合索引中前缀可定位、后续条件可继续过滤的场景。"},{"id":110,"question":"在 MySQL 中建索引时需要注意哪些事项？","category":"MySQL","answer":"建索引应围绕高选择性、常用过滤和排序字段设计，遵守最左前缀原则，控制联合索引列数和宽度，避免对低基数字段或频繁变更字段盲目建索引；同时要考虑覆盖索引、写入成本、索引长度、数据分布并通过 EXPLAIN 验证。"},{"id":111,"question":"MySQL 中使用索引一定有效吗？如何排查索引效果？","category":"MySQL","answer":"使用索引不一定更快，优化器会根据成本选择全表扫描、索引扫描或其他计划；排查时使用 EXPLAIN 或 EXPLAIN ANALYZE 查看 type、key、rows、filtered、Extra，结合慢查询日志、实际执行耗时、数据分布和索引统计信息判断，必要时更新统计信息或优化 SQL。"},{"id":112,"question":"MySQL 中的索引数量是否越多越好？为什么？","category":"MySQL","answer":"索引不是越多越好，因为每个索引都会占用磁盘和内存，并增加 INSERT、UPDATE、DELETE 时的维护、锁和日志开销，还可能让优化器选择错误计划；应根据真实查询建立必要索引，定期清理重复、冗余和长期未使用的索引。"},{"id":113,"question":"请详细描述 MySQL 的 B+ 树中查询数据的全过程","category":"MySQL","answer":"查询先从 B+ 树根节点开始，在每层节点通过二分查找定位目标键所在的子节点，逐层向下直到叶子节点；叶子节点按键有序并通过链表连接，定位后可顺序扫描范围数据，聚簇索引直接取得整行，二级索引则可能根据主键回表。"},{"id":114,"question":"为什么 MySQL 选择使用 B+ 树作为索引结构？","category":"MySQL","answer":"B+ 树非叶子节点只存键和指针、单个节点可容纳更多键，因此树高低、磁盘 I/O 少；所有数据位于叶子节点且叶子有序链表连接，既适合等值查询，也适合范围查询和排序，综合性能优于链表、二叉树和普通 B 树。"},{"id":115,"question":"MySQL 中的日志类型有哪些？binlog、redo log 和 undo log 的作用和区别是什么？","category":"MySQL","answer":"binlog 是 Server 层的逻辑日志，用于主从复制和数据恢复；redo log 是 InnoDB 的物理重做日志，记录页面修改并保证崩溃恢复；undo log 保存旧版本数据，用于事务回滚和 MVCC。三者记录目的、层次、格式和生命周期不同。"},{"id":116,"question":"MySQL 是如何实现事务的？","category":"MySQL","answer":"MySQL 事务依靠 InnoDB 的 redo log 保证持久性、undo log 支持回滚和 MVCC，锁机制保证并发隔离，事务管理器协调提交过程；通过 begin、commit 和 rollback 定义边界，并结合 binlog 与两阶段提交保证存储引擎日志和复制日志的一致性。"},{"id":117,"question":"MySQL 中长事务可能会导致哪些问题？","category":"MySQL","answer":"长事务会长时间持有锁，阻塞其他事务并增加死锁风险，还会使 undo log 无法及时清理、导致历史版本膨胀和 purge 延迟，可能占用连接、影响复制延迟和磁盘空间；应缩短事务范围、避免事务内执行慢操作并监控未提交事务。"},{"id":118,"question":"MySQL 中的 MVCC 是什么？","category":"MySQL","answer":"MVCC 是多版本并发控制，InnoDB 通过隐藏字段、undo log 版本链和 ReadView 为事务提供一致性读；普通查询读取符合可见性规则的历史版本，从而减少读写互斥，在保证隔离性的同时提高并发性能。"},{"id":119,"question":"MySQL 二级索引有 MVCC 快照吗？","category":"MySQL","answer":"InnoDB 二级索引记录通常不完整保存 MVCC 所需的事务版本信息，因此一致性读通过二级索引找到主键后，往往需要回表到聚簇索引，根据行的隐藏字段和 undo 版本链判断可见性；满足覆盖条件时也会结合可见性规则处理。"},{"id":120,"question":"如果 MySQL 中没有 MVCC，会有什么影响？","category":"MySQL","answer":"没有 MVCC 时，一致性读很难读取历史版本，读操作可能必须加锁等待写操作完成，或直接读取未提交数据；这会导致并发能力下降、锁竞争和阻塞增加，难以同时实现较好的隔离性、一致性和性能。"},{"id":121,"question":"MySQL 中的事务隔离级别有哪些？","category":"MySQL","answer":"MySQL InnoDB 支持读未提交、读已提交、可重复读和串行化四种隔离级别，分别在脏读、不可重复读、幻读控制和并发性能之间做权衡；InnoDB 通过 MVCC 与锁机制实现相应隔离语义。"},{"id":122,"question":"MySQL 默认的事务隔离级别是什么？为什么选择这个级别？","category":"MySQL","answer":"MySQL InnoDB 默认隔离级别通常是 REPEATABLE READ，可保证同一事务内普通一致性读看到稳定快照，并通过间隙锁等机制控制范围写入；它在一致性和并发性之间取得平衡，同时兼容 MySQL 早期复制和业务实践。"},{"id":123,"question":"数据库的脏读、不可重复读和幻读分别是什么？","category":"MySQL","answer":"脏读是读到其他事务尚未提交的数据，不可重复读是同一事务两次读取同一行结果不同，幻读是同一事务按范围查询时两次结果集的行数不同；它们分别反映未提交数据、已提交修改和范围新增或删除带来的并发问题。"},{"id":124,"question":"MySQL 中有哪些锁类型？","category":"MySQL","answer":"按粒度可分为表锁、页锁和行锁，InnoDB 主要使用行锁；按兼容性有共享锁和排他锁，按锁定范围有记录锁、间隙锁和临键锁，另外还有意向锁、自增锁和元数据锁，用于协调不同层次的并发访问。"},{"id":125,"question":"MySQL 的乐观锁和悲观锁是什么？","category":"MySQL","answer":"悲观锁假设冲突会发生，读取时通过数据库锁提前占用资源，例如 SELECT FOR UPDATE；乐观锁假设冲突较少，更新时使用版本号或更新时间条件校验，失败后重试。前者适合冲突高且必须串行的场景，后者适合读多写少的场景。"},{"id":126,"question":"MySQL 中如果发生死锁应该如何解决？","category":"MySQL","answer":"先通过死锁日志、SHOW ENGINE INNODB STATUS 和监控定位事务及锁资源，再统一访问顺序、缩短事务、减少锁范围、为条件建立合适索引并避免长事务；应用层还应捕获死锁异常并进行有限次数重试，不能只依赖数据库自动回滚。"},{"id":127,"question":"如何使用 MySQL 的 EXPLAIN 语句进行查询分析？","category":"MySQL","answer":"使用 EXPLAIN 查看执行计划，重点关注 type、possible_keys、key、key_len、rows、filtered、Extra 和 partitions；优先避免 ALL、过大的 rows、Using filesort 和 Using temporary，结合实际数据用 EXPLAIN ANALYZE 验证估算与真实耗时是否一致。"},{"id":128,"question":"MySQL 中 count(*)、count(1) 和 count(字段名) 有什么区别？","category":"MySQL","answer":"count(*) 和 count(1) 都统计结果行数，通常性能接近且不会忽略 NULL；count(字段名) 只统计该字段非 NULL 的行。InnoDB 中具体执行效率取决于索引、查询条件和版本，不能简单认为某一种始终更快。"},{"id":129,"question":"MySQL 中 int(11) 的 11 表示什么？","category":"MySQL","answer":"在现代 MySQL 中，INT(11) 的 11 是显示宽度，不代表可存储 11 位数字，也不改变取值范围；真正范围由 INT 类型及是否 UNSIGNED 决定，显示宽度已逐步被废弃，业务设计不应依赖它。"},{"id":130,"question":"MySQL 中 varchar 和 char 有什么区别？","category":"MySQL","answer":"CHAR 是定长字符串，长度不足时按规则填充，适合长度固定的数据；VARCHAR 是变长字符串，只占用实际长度加少量长度信息，适合长度变化较大的数据。两者还会影响存储空间、比较行为、行格式和更新性能，应按数据特征选择。"},{"id":131,"question":"MySQL 中如何进行 SQL 调优？","category":"MySQL","answer":"先通过慢查询日志、监控和 EXPLAIN 定位问题，再从减少扫描行数、优化过滤条件、设计合适索引、避免回表和深分页、减少不必要字段与 JOIN、改写 SQL 及控制返回数据量等方面优化，最后用接近生产的数据进行压测和回归验证。"},{"id":132,"question":"如何在 MySQL 中避免单点故障？","category":"MySQL","answer":"可采用主从复制或高可用集群，配合自动故障检测、选主、VIP 或代理切换，并做好备份、恢复演练和监控告警；关键是确保复制拓扑、数据一致性、故障切换、连接重试和应用降级策略都经过演练。"},{"id":133,"question":"如何在 MySQL 中实现读写分离？","category":"MySQL","answer":"通常由主库负责写入和强一致读，从库负责查询，应用或数据库代理根据 SQL 类型路由请求；实现时要处理复制延迟、事务内读写一致性、读后写一致性、主库故障切换和连接池配置，不能简单按查询类型机械分流。"},{"id":134,"question":"什么是 MySQL 的主从同步机制？它是如何实现的？","category":"MySQL","answer":"主库将事务变更写入 binlog，从库的 I/O 线程读取主库日志并写入 relay log，SQL 线程或并行复制线程再重放 relay log 更新从库数据；现代 MySQL 支持基于 GTID、半同步和并行复制，以增强定位能力、可靠性和复制性能。"},{"id":135,"question":"如何处理 MySQL 的主从同步延迟？","category":"MySQL","answer":"先监控定位延迟原因，再通过并行复制、提升从库硬件、优化大事务和慢 SQL、减少从库压力、合理调整日志与网络配置来改善；应用层可对关键读请求临时读主库、使用 GTID 等待从库追平，并保证业务具备最终一致性处理能力。"},{"id":136,"question":"什么是分库分表？分库分表有哪些类型（或策略）？","category":"MySQL","answer":"分库分表是将数据拆分到多个数据库或数据表，以提升容量和并发能力；按维度可分为垂直分库、垂直分表、水平分库和水平分表，水平拆分常用范围、哈希、时间或一致性哈希策略，选择时要考虑查询路由和数据均衡。"},{"id":137,"question":"如果组长要求你主导项目中的分库分表，大致的实施流程是？","category":"MySQL","answer":"先评估数据量、增长速度、热点和查询模式，确定拆分维度与分片键，再设计路由、主键、扩容和跨分片查询方案，选择中间件并完成灰度迁移、双写或数据校验，最后压测验证、逐步切流、监控告警并准备回滚方案。"},{"id":138,"question":"对数据库进行分库分表可能会引发哪些问题？","category":"MySQL","answer":"可能引发跨库事务和 JOIN 复杂、分页排序困难、全局唯一 ID 生成、数据迁移和扩容成本增加、热点分片、查询路由复杂以及运维监控困难等问题；因此应优先通过索引、架构和缓存优化，只有单库容量或并发确实成为瓶颈时再拆分。"},{"id":139,"question":"从 MySQL 获取数据，是从磁盘读取的吗？（buffer pool）","category":"MySQL","answer":"不一定，InnoDB 查询会先在 Buffer Pool 中查找数据页和索引页，命中则直接从内存读取；未命中时才从磁盘加载页面到 Buffer Pool，再进行访问。Buffer Pool 还缓存脏页、索引页和部分其他数据，是减少磁盘 I/O 的核心组件。"},{"id":140,"question":"MySQL 的 Doublewrite Buffer 是什么？它有什么作用？","category":"MySQL","answer":"Doublewrite Buffer 是 InnoDB 用于防止页面部分写入的保护机制，脏页写入数据文件前先顺序写入 doublewrite 区域并刷盘，再写入实际位置；若发生崩溃导致页面撕裂，可从完整副本恢复页面，增强数据页可靠性。"},{"id":141,"question":"MySQL 中的 Log Buffer 是什么？它有什么作用？","category":"MySQL","answer":"Log Buffer 是 InnoDB 在内存中暂存 redo log 的区域，事务修改产生的日志先写入其中，再按提交、容量或定时策略刷新到 redo log 文件；它可减少频繁磁盘写入，但过小会增加刷新频率，过大则会占用内存并延长故障恢复范围。"},{"id":142,"question":"为什么在 MySQL 中不推荐使用多表 JOIN？","category":"MySQL","answer":"并不是绝对不推荐，而是复杂或大数据量多表 JOIN 可能产生大量中间结果、排序和临时表，增加优化与扩展难度；如果表关系清晰、连接条件有索引且数据量可控，JOIN 通常比应用层多次查询更高效，应依据执行计划和业务场景判断。"},{"id":143,"question":"MySQL 中如何解决深度分页的问题？","category":"MySQL","answer":"深度分页应优先使用基于唯一递增键或稳定联合键的游标分页，使用 WHERE 条件定位上一页边界；也可以利用覆盖索引先获取主键再回表，避免大 OFFSET 扫描，或通过搜索条件、分区和业务限制减少需要跳过的数据量。"},{"id":144,"question":"如何在 MySQL 中监控和优化慢 SQL？","category":"MySQL","answer":"开启并分析慢查询日志，结合 performance_schema、监控平台和应用链路定位高耗时、高频及高扫描量 SQL；再用 EXPLAIN ANALYZE 检查执行计划，通过索引、SQL 改写、数据归档、分页和资源配置优化，最后进行压测并持续观察回归效果。"},{"id":145,"question":"MySQL 中 DELETE、DROP 和 TRUNCATE 的区别是什么？","category":"MySQL","answer":"DELETE 删除行，可带 WHERE，通常记录行级日志并可在事务中回滚；TRUNCATE 快速清空整表，通常重建或释放数据空间且不能按条件删除；DROP 删除表结构及数据。三者对锁、日志、触发器、自增值和回滚能力的影响都不同，使用前必须确认范围。"},{"id":146,"question":"MySQL 中 INNER JOIN、LEFT JOIN 和 RIGHT JOIN 的区别是什么？","category":"MySQL","answer":"INNER JOIN 只返回两表满足连接条件的匹配行；LEFT JOIN 保留左表全部行，右表无匹配时补 NULL；RIGHT JOIN 保留右表全部行，使用上通常可通过交换表顺序改写为 LEFT JOIN。连接条件和 WHERE 条件的位置会影响外连接结果。"},{"id":147,"question":"MySQL 中 `LIMIT 100000000, 10` 和 `LIMIT 10` 的执行速度是否相同？","category":"MySQL","answer":"通常不相同，LIMIT 100000000,10 需要扫描、排序或定位并跳过前面大量记录后才返回 10 条，因此随着偏移量增大性能下降；LIMIT 10 只需获取前 10 条。深分页应改用游标分页或先定位主键。"},{"id":148,"question":"MySQL 中 DATETIME 和 TIMESTAMP 类型的区别是什么？","category":"MySQL","answer":"DATETIME 表示日期时间，存储范围更大且通常不进行时区转换；TIMESTAMP 存储为 UTC 并按会话时区转换显示，范围相对较小且占用空间通常更少。跨时区业务常明确使用 UTC 和 DATETIME 或根据版本规则选择合适类型。"},{"id":149,"question":"数据库的三大范式是什么？","category":"MySQL","answer":"第一范式要求字段不可再分，第二范式要求非主键字段完全依赖主键，第三范式要求非主键字段不传递依赖主键；范式化能减少冗余和更新异常，但实际系统会根据读性能、查询复杂度和一致性需求适度反规范化。"},{"id":150,"question":"在 MySQL 中，你使用过哪些函数？","category":"MySQL","answer":"常用函数包括字符串函数 CONCAT、SUBSTRING、LENGTH，数值函数 ROUND、CEIL，日期函数 NOW、DATE_FORMAT、DATE_ADD，聚合函数 COUNT、SUM、AVG、MAX、MIN，条件函数 IF、CASE，以及空值处理函数 COALESCE、IFNULL。"},{"id":151,"question":"MySQL 中 TEXT 类型最大可以存储多长的文本？","category":"MySQL","answer":"TEXT 类型按容量分为 TINYTEXT、TEXT、MEDIUMTEXT 和 LONGTEXT，最大长度大约分别为 255 字节、64KB、16MB 和 4GB，但实际可用大小还受字符集、行格式、协议、内存和最大数据包等限制影响。"},{"id":152,"question":"MySQL 中 AUTO_INCREMENT 列达到最大值时会发生什么？","category":"MySQL","answer":"当 AUTO_INCREMENT 达到对应整数类型的最大值后，继续插入需要新值的记录会失败并报超出范围或无法生成新值；解决办法是扩大字段类型、改用 BIGINT、清理或归档数据，并提前监控当前值和增长速度。"},{"id":153,"question":"在 MySQL 中存储金额数据，应该使用什么数据类型？","category":"MySQL","answer":"金额通常使用 DECIMAL 定点类型，例如 DECIMAL(18,2)，它能精确保存小数，避免 FLOAT 和 DOUBLE 的二进制浮点误差；精度和小数位应根据业务最大金额及结算规则设计，不能简单依赖浮点类型。"},{"id":154,"question":"什么是数据库的视图？","category":"MySQL","answer":"视图是基于查询语句定义的虚拟表，保存的是查询逻辑而非通常意义上的独立数据；它可以封装复杂查询、简化访问并隐藏部分列和行，但普通视图查询仍依赖底层表，复杂视图可能影响性能且更新能力受限。"},{"id":155,"question":"什么是数据库的游标？","category":"MySQL","answer":"数据库游标用于逐行遍历查询结果，适合需要按记录执行复杂处理的存储过程或程序逻辑；它比集合操作更灵活但通常性能更低、占用资源更多，因此能用批量 SQL 完成的任务应优先使用集合运算。"},{"id":156,"question":"为什么不推荐在 MySQL 中直接存储图片、音频、视频等大容量内容？","category":"MySQL","answer":"大文件存入数据库会造成表和备份体积膨胀、数据库 I/O 与缓存压力增大，并影响备份恢复、扩容和查询性能；通常将文件放对象存储或文件系统，数据库只保存 URL、元数据和校验信息，必要时通过权限和签名 URL 控制访问。"},{"id":157,"question":"相比于 Oracle，MySQL 的优势有哪些？","category":"MySQL","answer":"MySQL 通常具有开源成本低、部署和使用简单、互联网生态成熟、读写性能较好、扩展和云服务支持广泛等优势；Oracle 在复杂事务、企业级功能、工具和大型商业支持方面更强，具体选型应结合规模、合规、生态和运维能力。"},{"id":158,"question":"MySQL 中 VARCHAR(100) 和 VARCHAR(10) 的区别是什么？","category":"MySQL","answer":"两者都按实际字符长度存储变长字符串，但 VARCHAR(100) 允许的最大长度更大，可能影响索引长度、排序临时空间、行格式和校验规则；括号中的数字是最大字符数而非固定占用空间，实际应按业务上限设置。"},{"id":159,"question":"在什么情况下，不推荐为数据库建立索引？","category":"MySQL","answer":"低基数且过滤性差的字段、数据量很小的表、写入更新极其频繁的表、很少用于查询的字段、重复或冗余索引以及长度过大的字段通常不适合单独建索引；最终应结合查询频率、选择性、写入成本和执行计划判断。"},{"id":160,"question":"MySQL 中 EXISTS 和 IN 的区别是什么？","category":"MySQL","answer":"EXISTS 关注子查询是否至少返回一行，找到匹配后即可停止，适合关联条件和外表驱动场景；IN 将值与子查询结果集合比较，优化器可能将其改写为半连接。两者没有绝对性能差异，应结合数据量、NULL 语义和 EXPLAIN 选择。"},{"id":161,"question":"什么是 Write-Ahead Logging (WAL) 技术？它的优点是什么？MySQL 中是否用到了 WAL？","category":"MySQL","answer":"WAL 要求数据页真正写入数据文件前，必须先将对应修改日志持久化，从而用顺序日志写入替代频繁随机写页，提升性能并支持崩溃恢复；InnoDB 使用 redo log 实现类似 WAL，同时通过 binlog 与两阶段提交保证事务日志一致性。"},{"id":162,"question":"你们生产环境的 MySQL 中使用了什么事务隔离级别？为什么？","category":"MySQL","answer":"生产环境通常根据业务选择，很多 MySQL InnoDB 系统使用默认的 REPEATABLE READ，以获得稳定的一致性读和较好的并发能力；如果更关注减少间隙锁和提高并发，也可能选择 READ COMMITTED，最终应依据一致性要求、锁冲突和实际压测结果确定。"},{"id":163,"question":"为什么阿里巴巴的 Java 手册不推荐使用存储过程？","category":"MySQL","answer":"不推荐通常是因为存储过程会耦合业务逻辑与数据库，增加版本管理、测试、发布和跨数据库迁移成本，且复杂逻辑不利于代码审查和工程化治理；简单的数据计算和批处理仍可使用，但核心业务逻辑一般放在应用层更易维护。"},{"id":164,"question":"如何实现数据库的不停服迁移？","category":"MySQL","answer":"常用流程是先创建目标库并进行全量复制，再通过 binlog 或 CDC 持续同步增量，完成数据校验和双写或短暂写入切换演练，最后在低峰期切换读写流量并保留回滚通道；整个过程要关注一致性、延迟、幂等和失败重试。"},{"id":165,"question":"MySQL 数据库的性能优化方法有哪些？","category":"MySQL","answer":"优化可从 SQL 与索引、表结构与数据类型、事务与锁、Buffer Pool 和磁盘、连接池、主从读写分离、分库分表、缓存、归档以及监控告警等层面展开；应先用慢日志和执行计划定位瓶颈，再针对性优化并通过压测验证。"},{"id":166,"question":"MySQL 中 InnoDB 存储引擎与 MyISAM 存储引擎的区别是什么？","category":"MySQL","answer":"InnoDB 支持事务、行级锁、MVCC、外键和崩溃恢复，聚簇索引适合高并发写入；MyISAM 不支持事务和外键，主要使用表锁，结构简单且读取场景曾有优势。现代业务系统通常优先选择 InnoDB。"},{"id":167,"question":"MySQL 的查询优化器如何选择执行计划？","category":"MySQL","answer":"优化器会解析 SQL、枚举可能的访问路径和连接顺序，根据索引统计信息、数据量、选择性、成本模型及系统配置估算每种计划代价，选择预计成本最低的方案；统计信息不准、数据倾斜或复杂 SQL 可能导致计划不佳，可用 EXPLAIN 和更新统计信息排查。"},{"id":168,"question":"什么是数据库的逻辑删除？数据库的物理删除和逻辑删除有什么区别？","category":"MySQL","answer":"逻辑删除通过状态字段或删除时间标记记录已删除，数据仍保留，便于恢复和审计；物理删除直接从表中移除数据，节省空间但恢复困难。逻辑删除会增加查询条件、唯一索引和数据膨胀处理复杂度，应配合索引和归档策略。"},{"id":169,"question":"什么是数据库的逻辑外键？数据库的物理外键和逻辑外键各有什么优缺点？","category":"MySQL","answer":"逻辑外键只在应用约定中保存关联关系，不由数据库强制约束；物理外键由数据库保证引用完整性和级联规则，数据一致性强但会增加锁、迁移和分库分表复杂度。高一致性单库场景适合物理外键，分布式系统常采用逻辑外键并通过应用与校验任务保证一致。"},{"id":170,"question":"MySQL 事务的二阶段提交是什么？","category":"MySQL","answer":"InnoDB 同时涉及 redo log 和 binlog 时采用二阶段提交：第一阶段将事务写入 redo log 并标记 prepare，第二阶段写入并刷盘 binlog，成功后再将 redo log 标记 commit；这样崩溃恢复时可根据两者状态判断事务是否应提交，保证复制与存储数据一致。"},{"id":171,"question":"MySQL 三层 B+ 树能存多少数据？","category":"MySQL","answer":"三层 B+ 树的容量取决于页大小、索引键长度、指针大小和叶子记录大小，不能给出固定值；以 InnoDB 默认 16KB 页和常见整数主键粗略估算，通常可达到千万级甚至更高，实际应通过表结构和索引设计计算，而不能只看树层数。"},{"id":172,"question":"MySQL 在设计表（建表）时需要注意什么？","category":"MySQL","answer":"建表时应明确业务主键和唯一性，选择合适数据类型、字符集、排序规则、NULL 策略和默认值，控制字段长度，设计必要索引和时间字段，并考虑事务、扩展、审计、软删除、分区及数据安全；同时避免冗余字段和无意义的大字段。"},{"id":173,"question":"MySQL 插入一条 SQL 语句，redo log 记录的是什么？","category":"MySQL","answer":"redo log 主要记录 InnoDB 数据页发生的物理修改信息，例如某个表空间页面中某个偏移位置被修改为何种内容或对应的页操作，而不是完整 SQL 文本；它用于事务持久化和崩溃恢复，具体日志格式由存储引擎实现。"},{"id":174,"question":"SQL 中 select、from、join、where、group by、having、order by、limit 的执行顺序是什么？","category":"MySQL","answer":"逻辑执行顺序通常是 FROM、JOIN 及其 ON 条件、WHERE、GROUP BY、HAVING、SELECT、ORDER BY、LIMIT；实际数据库可能通过优化器改写和下推条件改变物理执行顺序，但理解逻辑顺序有助于正确使用别名、聚合和过滤条件。"},{"id":175,"question":"为什么 MySQL 索引用的是 B+ 树而不是红黑树？","category":"MySQL","answer":"红黑树高度相对更高，节点分散会产生更多磁盘随机 I/O；B+ 树一个节点能存放大量有序键，树高更低，且叶子节点链表天然适合范围查询和顺序扫描，因此更适合数据库基于磁盘和页的索引访问。"},{"id":176,"question":"MySQL一张表最多可以有多少列？","category":"MySQL","answer":"MySQL 表的列数没有脱离版本、存储引擎、数据类型和行大小限制的统一答案，InnoDB 还受最大行大小、页格式和隐藏列等约束；设计时不应追求上限，而应通过垂直拆表、JSON 或关联表控制表宽，并以目标版本文档和实际建表验证为准。"},{"id":177,"question":"什么是 CDC（Change Data Capture）？常见的 CDC 工具有哪些？","category":"MySQL","answer":"CDC 是捕获数据库新增、修改和删除变更并转换为事件流的技术，常用于实时同步、数仓和缓存更新；MySQL 常见方案包括基于 binlog 的 Debezium、Canal、Maxwell，以及 Flink CDC 等，选择时要关注断点续传、顺序、幂等、DDL 和一致性。"},{"id":178,"question":"多线程并发同步数据时（数据库的数据同步到数仓中）需要注意什么问题？","category":"MySQL","answer":"需要保证任务分片不重不漏、增量位点或水位可追踪，处理主键冲突和幂等写入，控制并发度避免压垮源库和目标库，并正确处理事务边界、数据顺序、删除事件、失败重试和断点恢复；同步完成后还应进行数量、校验和业务口径校验。"},{"id":179,"question":"Redis 主从复制的实现原理是什么？","category":"Redis","answer":"Redis 主从复制通常由从节点向主节点发送 PSYNC 请求，主节点根据复制偏移量和复制积压缓冲区决定执行部分重同步或全量重同步；全量同步时主节点生成 RDB 发送给从节点，之后持续发送复制期间产生的命令，从节点重放命令并维护自己的复制偏移量。"},{"id":180,"question":"Redis 集群的实现原理是什么？","category":"Redis","answer":"Redis Cluster 将整个键空间划分为 16384 个哈希槽，节点负责部分槽位，客户端根据 CRC16(key) mod 16384 定位节点；节点之间通过 gossip 协议交换状态，支持主从故障转移和数据分片，客户端遇到错误节点时可根据 MOVED 或 ASK 响应重新路由请求。"},{"id":181,"question":"Redis 通常应用于哪些场景？","category":"Redis","answer":"Redis 常用于缓存、分布式锁、Session 共享、排行榜、计数器、限流、消息队列、延迟队列、发布订阅、地理位置查询和实时统计等场景；选型时应根据数据一致性、持久化、吞吐量和数据规模评估其适用性。"},{"id":182,"question":"Redis 为什么这么快？","category":"Redis","answer":"Redis 速度快主要因为数据存储在内存中，命令执行路径短，底层数据结构高效，采用单线程事件循环避免了大量线程切换和锁竞争，并通过 I/O 多路复用处理大量连接；实际性能还取决于命令复杂度、网络、持久化和数据规模。"},{"id":183,"question":"为什么 Redis 设计为单线程？6.0 版本为何引入多线程？","category":"Redis","answer":"Redis 的核心命令执行采用单线程，可避免共享数据竞争、锁开销和上下文切换，并保证命令原子性；Redis 6.0 引入多线程主要用于网络读写和协议解析，将 I/O 开销分摊到多个线程，命令执行仍通常由主线程完成，以保持实现简单和执行顺序可控。"},{"id":184,"question":"Redis 中常见的数据类型有哪些？","category":"Redis","answer":"Redis 常见基础类型包括 String、List、Hash、Set 和 Sorted Set，扩展数据结构包括 Bitmap、HyperLogLog、GEO、Stream；不同类型分别适合缓存值、队列、对象属性、集合运算、排行榜、基数统计、地理位置和消息流等场景。"},{"id":185,"question":"Redis 中跳表的实现原理是什么？","category":"Redis","answer":"跳表由多层有序链表组成，底层保存全部元素，上层是逐层抽样的索引；查询从最高层开始向右移动，超过目标后下降一层，平均时间复杂度为 O(logN)，插入和删除也为平均 O(logN)，实现比平衡树简单且便于范围遍历。"},{"id":186,"question":"Redis 的 hash 是什么？","category":"Redis","answer":"Redis Hash 是字段和值组成的映射集合，适合存储对象属性，例如 user:1 下的 name 和 age；它支持 HSET、HGET、HINCRBY 等字段级操作，可减少对象整体序列化和更新成本，但单个 Hash 过大仍需关注内存和热 key 问题。"},{"id":187,"question":"Redis 和 Memcached 有哪些区别？","category":"Redis","answer":"Redis 支持多种数据结构、持久化、复制、哨兵、集群、事务、Lua 和发布订阅，功能更完整；Memcached 主要是简单的键值缓存，模型和部署更简单。Redis 的能力更强但运维和资源管理也更复杂，具体选择取决于场景。"},{"id":188,"question":"Redis 支持事务吗？如何实现？","category":"Redis","answer":"Redis 支持通过 MULTI、命令入队、EXEC 批量执行以及 DISCARD 取消事务，并可用 WATCH 实现乐观锁式的 CAS；Redis 事务保证命令按顺序串行执行和不会被其他客户端插入，但不支持关系型数据库那样的回滚机制，执行期间出现错误不会自动撤销已执行命令。"},{"id":189,"question":"Redis 数据过期后的删除策略是什么？","category":"Redis","answer":"Redis 采用惰性删除和定期删除结合的策略：访问到过期键时立即删除，后台定期随机抽查并删除过期键；过期数据未必立刻从内存消失，内存不足时还会通过淘汰策略回收空间。"},{"id":190,"question":"Redis 中有哪些内存淘汰策略？","category":"Redis","answer":"Redis 可配置 noeviction、volatile-lru、volatile-lfu、volatile-random、volatile-ttl、allkeys-lru、allkeys-lfu 和 allkeys-random 等策略；volatile 只在设置过期时间的键中淘汰，allkeys 可从全部键中淘汰，选择应结合缓存命中率和业务数据重要性。"},{"id":191,"question":"Redis 的 Lua 脚本功能是什么？如何使用？","category":"Redis","answer":"Lua 脚本允许将多条 Redis 命令封装在服务端一次执行，脚本执行期间具有原子性，可减少网络往返并实现复杂的条件更新；通常使用 EVAL 或 EVALSHA 传入脚本、键数量和参数，脚本应短小、无阻塞并避免执行不可控循环。"},{"id":192,"question":"Redis 的 Pipeline 功能是什么？","category":"Redis","answer":"Pipeline 将多条命令一次性发送给 Redis，再批量读取响应，从而减少客户端与服务器之间的网络往返，提高批量操作吞吐量；Pipeline 不等同于事务，命令之间没有事务隔离和原子性，需要原子操作时应使用 MULTI/EXEC 或 Lua。"},{"id":193,"question":"Redis 中的 Big Key 问题是什么？如何解决？","category":"Redis","answer":"Big Key 是单个键对应的数据过大或集合成员过多，可能造成网络传输慢、命令阻塞、删除耗时长、内存不均和主从同步压力；应通过拆分键、控制集合大小、使用渐进式遍历和异步删除，配合 bigkeys、memory usage 等工具发现和治理。"},{"id":194,"question":"如何解决 Redis 中的热点 key 问题？","category":"Redis","answer":"热点 key 是大量请求集中访问少数键，可能导致单线程节点 CPU 或网络过载；可采用本地缓存、多级缓存、热点数据复制为多个副本并随机访问、合理设置过期时间和限流，并在集群中优化键分布，避免简单粗暴地复制所有数据。"},{"id":195,"question":"Redis 的持久化机制有哪些？","category":"Redis","answer":"Redis 主要支持 RDB 和 AOF，RDB 通过生成快照保存某一时刻的数据，文件紧凑、恢复快；AOF 按写命令记录变更，数据丢失窗口更小但文件通常更大，可通过重写压缩；两者可同时开启，启动时通常优先使用符合条件的 AOF。"},{"id":196,"question":"Redis 在生成 RDB 文件时如何处理请求？","category":"Redis","answer":"执行 BGSAVE 时 Redis 使用 fork 创建子进程，由子进程遍历内存并生成 RDB，主进程继续处理客户端请求；由于采用写时复制，主进程修改页面时才复制相应内存页，因此会带来额外内存和 fork 开销，不能在大实例高峰期忽视其影响。"},{"id":197,"question":"Redis 的哨兵机制是什么？","category":"Redis","answer":"Sentinel 由多个哨兵监控主从节点，执行健康检查、主观和客观下线判断、自动故障转移、选举新主并通知客户端；多个 Sentinel 通过 quorum 达成共识，可提高高可用性，但它主要解决主从故障切换，不负责数据分片。"},{"id":198,"question":"Redis 集群会出现脑裂问题吗？","category":"Redis","answer":"Redis 主从或集群在网络分区、节点隔离和故障转移配置不当时可能出现脑裂，即多个节点或客户端认为自己是主节点并接受写入；可通过合理配置 quorum、节点超时、复制缓冲和 min-replicas-to-write 等参数降低风险，并在应用层处理冲突与数据校验。"},{"id":199,"question":"Redis 的订阅发布功能是什么？你了解吗？","category":"Redis","answer":"Redis Pub/Sub 允许客户端订阅频道，发布者向频道发布消息后，当前在线订阅者即可收到消息；它实时性高、实现简单，但消息不持久化、不支持离线消费和可靠确认，因此可靠消息场景更适合 Redis Streams 或专业消息队列。"},{"id":200,"question":"Redis 中如何实现分布式锁？","category":"Redis","answer":"常用方式是使用 SET key value NX EX/PX 原子地加锁，value 使用唯一随机值；释放锁时必须通过 Lua 校验 value 后再删除，避免误删他人锁。生产环境还要考虑过期时间、续期、故障恢复、重试退避和锁粒度，不能只使用 SETNX 后再单独设置过期时间。"},{"id":201,"question":"分布式锁在未完成逻辑前过期怎么办？","category":"Redis","answer":"可使用看门狗或后台续期机制，在业务执行期间定期延长锁的 TTL，并设置最大执行时间和异常停止续期；同时通过唯一锁值、Lua 校验释放、防止旧客户端误操作，必要时使用 fencing token 让下游系统拒绝过期持有者的写入。"},{"id":202,"question":"Redis 的 Red Lock 是什么？你了解吗？","category":"Redis","answer":"Redlock 是在多个相互独立的 Redis 实例上尝试加锁，客户端在有效时间内取得多数实例锁后认为加锁成功，并扣除网络耗时计算剩余租期；它旨在降低单节点故障影响，但实现复杂、对时钟和网络假设敏感，强一致场景应谨慎评估并考虑共识系统和 fencing token。"},{"id":203,"question":"Redis 实现分布式锁时可能遇到的问题有哪些？","category":"Redis","answer":"常见问题包括锁误删、锁过期导致并发执行、客户端宕机、网络分区、主从异步复制丢锁、续期失败、死锁、重试风暴和业务不可重入；应使用唯一值加 Lua 释放、合理 TTL 与续期机制、幂等业务、超时重试和必要的 fencing token。"},{"id":204,"question":"Redis 中的缓存击穿、缓存穿透和缓存雪崩是什么？","category":"Redis","answer":"缓存击穿是热点 key 过期时大量请求同时访问数据库，穿透是请求不存在的数据导致反复查库，雪崩是大量 key 同时过期或缓存服务整体不可用；可分别采用互斥锁或逻辑过期、布隆过滤器和空值缓存、随机过期时间与多级缓存降级等方案。"},{"id":205,"question":"Redis 中如何保证缓存与数据库的数据一致性？","category":"Redis","answer":"常见策略是先更新数据库再删除缓存，必要时通过消息队列、重试任务或订阅 binlog 补偿删除；更新缓存容易产生并发覆盖和双写不一致，因此应结合业务一致性要求、延迟容忍度、幂等操作和最终一致性校验选择方案。"},{"id":206,"question":"Redis String 类型的底层实现是什么？（SDS）","category":"Redis","answer":"Redis String 主要由 SDS（Simple Dynamic String）实现，结构中保存字符串长度、可用空间和字符数组；SDS 能 O(1) 获取长度，支持预分配和惰性释放，避免缓冲区溢出并减少扩容次数，同时可存储二进制安全数据。"},{"id":207,"question":"如何使用 Redis 快速实现排行榜？","category":"Redis","answer":"使用 Sorted Set 保存成员及其分数，通过 ZADD 更新分数，ZREVRANGE 或 ZRANGE 获取排名，ZREVRANK 或 ZRANK 查询名次，ZSCORE 查询分数；分数相同时应设计稳定的二级排序或将时间等信息编码进分数，避免排名不确定。"},{"id":208,"question":"如何使用 Redis 快速实现布隆过滤器？","category":"Redis","answer":"布隆过滤器使用多个哈希函数将元素映射到位数组，查询时若任一位为 0 则一定不存在，全部为 1 表示可能存在，因此有误判但无漏判；可使用 RedisBloom 的 BF.RESERVE、BF.ADD 和 BF.EXISTS，并根据容量和误判率配置位数组和哈希数量。"},{"id":209,"question":"如何使用 Redis 统计大量用户唯一访问量（UV）？","category":"Redis","answer":"若需要精确 UV，可按日期使用 Set 存储用户 ID 并用 SADD 和 SCARD 统计；若数据量很大且允许小误差，可使用 HyperLogLog，通过 PFADD 记录用户并用 PFCOUNT 统计，内存占用远小于 Set，但无法取出具体用户列表。"},{"id":210,"question":"Redis 中的 Geo 数据结构是什么？","category":"Redis","answer":"Redis GEO 基于 Sorted Set 保存地理位置，将经纬度编码为 geohash 分数，通过 GEOADD 写入位置，GEOPOS 获取坐标，GEODIST 计算距离，GEOSEARCH 查询范围；它适合附近的人、门店和配送范围等场景，但复杂空间分析应使用专业 GIS。"},{"id":211,"question":"你在项目中使用的 Redis 客户端是什么？","category":"Redis","answer":"Java 项目中常用 Lettuce 或 Jedis，Spring Data Redis 可统一封装两者；Lettuce 基于 Netty，支持线程安全连接共享和响应式 API，适合高并发，Jedis API 简洁但连接通常不跨线程共享。实际选择应结合异步模型、连接池、序列化和团队维护经验。"},{"id":212,"question":"Redis 字符串类型的最大值大小是多少？","category":"Redis","answer":"Redis String 单个值的最大长度通常为 512MB，但实际可用大小还受版本、内存、网络协议、复制、持久化和命令耗时影响；生产中不应存放接近上限的大对象，应拆分数据并控制单次读写大小。"},{"id":213,"question":"Redis 性能瓶颈时如何处理？","category":"Redis","answer":"先通过慢日志、INFO、LATENCY、命令统计和监控定位是 CPU、网络、内存、持久化还是大 key 问题，再优化高复杂度命令、批量化请求、Pipeline、连接池和数据结构，治理 big key 与 hot key，必要时分片扩容并调整持久化和淘汰策略。"},{"id":214,"question":"Redis 中 EMBSTR 对象的阈值设置为何为 44？其调整历史是什么？","category":"Redis","answer":"EMBSTR 将 RedisObject 和 SDS 连续分配，减少内存分配次数并提高局部性；阈值取决于对象头、SDS 头、分配器对齐和布局，使整体对象尽量落在一个合适的小内存块中。不同 Redis 版本和 SDS 结构调整会导致阈值变化，不能脱离具体版本源码绝对化。"},{"id":215,"question":"Redis 中原生批处理命令（MSET、MGET）与 Pipeline 的区别是什么？","category":"Redis","answer":"MSET、MGET 是服务器原生单条命令，语义和参数固定，通常一次执行完成；Pipeline 是客户端将多条独立命令批量发送，减少网络往返但不天然提供事务原子性，命令数量和类型更灵活，适合批量执行不同操作。"},{"id":216,"question":"Redis 主从复制的常见拓扑结构有哪些？","category":"Redis","answer":"常见拓扑包括一主一从、一主多从、树状级联复制和哨兵管理的主从集群；一主多从便于读扩展但主节点复制压力较大，级联可分担复制流量，哨兵则在此基础上提供监控、选主和故障转移能力。"},{"id":217,"question":"Redis List 类型的常见操作命令有哪些？","category":"Redis","answer":"List 常用命令包括 LPUSH、RPUSH 从两端插入，LPOP、RPOP 从两端弹出，LRANGE 获取范围，LLEN 获取长度，LINSERT 插入，LSET 修改，以及 BLPOP、BRPOP 阻塞弹出；它适合队列、栈和简单消息缓冲。"},{"id":218,"question":"如何在 Redis 中实现队列和栈数据结构？","category":"Redis","answer":"队列可使用 LPUSH 配合 RPOP，或 RPUSH 配合 LPOP，实现先进先出；栈可使用 LPUSH 配合 LPOP，或 RPUSH 配合 RPOP，实现后进先出。需要阻塞等待时使用 BLPOP 或 BRPOP，可靠消费则更推荐 Streams。"},{"id":219,"question":"Redis 中的 Ziplist 和 Quicklist 数据结构的特点是什么？","category":"Redis","answer":"Ziplist 是连续内存编码的紧凑列表，内存效率高但插入删除可能触发移动，过大时性能下降；Quicklist 是多个小型连续列表节点组成的双向链表，通过控制节点大小在内存占用和操作性能之间折中，历史版本中 List 曾主要采用它。"},{"id":220,"question":"Redis 复制延迟的常见原因有哪些？","category":"Redis","answer":"常见原因包括主节点写入突增、从节点 CPU 或磁盘繁忙、网络带宽或延迟、全量同步、慢命令和大 key、持久化 fork 造成资源竞争，以及从节点处理能力不足；应监控 master_repl_offset、slave_repl_offset、复制 backlog、网络和慢日志进行定位。"},{"id":221,"question":"Redis 事务与关系型数据库事务的主要区别是什么？","category":"Redis","answer":"Redis 事务通过 MULTI/EXEC 将命令按顺序执行，具备原子执行特性但通常没有自动回滚和完整隔离级别；关系型数据库事务通常支持 ACID、锁、MVCC、回滚和持久化语义。Redis 更适合轻量原子批处理，复杂一致性事务应使用数据库事务。"},{"id":222,"question":"Redis Cluster 模式与 Sentinel 模式的区别是什么？","category":"Redis","answer":"Redis Cluster 通过哈希槽实现数据分片，同时支持副本和故障转移，适合横向扩容；Sentinel 管理单个或多个主从组，主要提供监控、选主和故障切换，不负责数据分片。Cluster 扩展能力更强，Sentinel 架构相对简单。"},{"id":223,"question":"Redis 的 ListPack 数据结构是什么？","category":"Redis","answer":"ListPack 是一种紧凑的连续内存结构，用于存储多个元素，设计目标是减少 Ziplist 的级联更新问题，并通过元素长度信息支持遍历和反向解析；Redis 新版本中的 Hash、Zset 等小对象编码可能使用 ListPack，具体取决于版本和阈值配置。"},{"id":224,"question":"Redis 中的内存碎片化是什么？如何进行优化？","category":"Redis","answer":"内存碎片化是分配器申请的内存块与实际数据需求不匹配，导致 RSS 明显高于 used_memory；可通过升级 Redis 和内存分配器、合理设置 active defrag、避免频繁创建销毁大小差异很大的对象、治理大 key，必要时通过主从切换或重启重建内存。"},{"id":225,"question":"Redis 的虚拟内存（VM）机制是什么？","category":"Redis","answer":"早期 Redis 曾提供虚拟内存机制，将部分 value 换出到磁盘以突破物理内存限制，但由于性能和复杂度问题已在后续版本移除；现代 Redis 通常依靠内存淘汰、数据分片、压缩或外部存储解决容量问题，不应将旧版 VM 作为当前方案。"},{"id":226,"question":"在 Redis 集群中，如何根据键定位到对应的节点？","category":"Redis","answer":"Redis Cluster 先计算键的 CRC16，再对 16384 取模得到哈希槽，槽位映射到负责该槽的主节点；若键包含大括号 hash tag，则只对大括号内的内容计算哈希，以便将相关键放入同一槽并支持多键操作。"},{"id":227,"question":"Redis 源码中有哪些巧妙的设计，举几个典型的例子？","category":"Redis","answer":"典型设计包括 SDS 的长度缓存和空间预分配、跳表的多层索引、渐进式 rehash 避免一次性阻塞、惰性删除与定期删除结合、RDB 的 fork 写时复制、事件循环加 I/O 多路复用，以及通过对象编码在不同数据规模下选择更省内存的底层结构。"},{"id":228,"question":"说说 Redisson 分布式锁的原理?","category":"Redis","answer":"Redisson 通常通过 Lua 脚本原子执行加锁、判断持有者和释放锁，锁值中包含客户端线程标识，避免误释放；加锁成功后启动看门狗续期任务，业务完成时删除锁并取消续期，同时支持可重入锁、读写锁、公平锁和联锁等高级能力。"},{"id":229,"question":"Redis Zset 的实现原理是什么？","category":"Redis","answer":"Redis Zset 同时维护成员到分数的字典映射和按分数有序的跳表，字典支持按成员快速查分，跳表支持按分数排序、排名和范围查询；小规模数据可能使用 ListPack 等紧凑编码，超过阈值后转换为字典加跳表结构。"},{"id":230,"question":"为什么 Redis Zset 用跳表实现而不是红黑树？B+树？","category":"Redis","answer":"跳表平均 O(logN) 的查询、插入和删除性能足够好，代码简单、范围遍历自然、实现和维护成本低；红黑树虽然有稳定的最坏复杂度但实现更复杂，B+ 树主要针对磁盘页和范围 I/O 优化，而 Redis Zset 主要驻留内存，因此跳表更符合场景。"},{"id":231,"question":"Redisson 看门狗（watch dog）机制了解吗？","category":"Redis","answer":"Redisson 看门狗会在客户端未显式指定租约时间时，为成功获取的锁定期续期，通常按固定周期检查并延长 TTL，防止业务执行时间超过初始锁期限；锁释放或客户端失联后续期停止，锁最终自动过期，但仍需设置合理超时并保证业务幂等。"},{"id":232,"question":"Java 中有哪些垃圾回收算法？","category":"JVM","answer":"常见垃圾回收算法包括标记-清除、复制、标记-整理和分代收集；标记-清除简单但会产生碎片，复制适合存活对象少的区域，标记-整理能消除碎片但移动对象成本较高，分代收集则根据对象生命周期分别采用不同算法。"},{"id":233,"question":"JVM 由哪些部分组成？","category":"JVM","answer":"JVM 主要由类加载子系统、运行时数据区、执行引擎、本地方法接口和本地方法库组成；类加载器负责加载类，运行时区域保存数据，执行引擎负责解释或编译执行字节码，垃圾收集器负责管理堆等运行时内存。"},{"id":234,"question":"JVM 的内存区域是如何划分的？","category":"JVM","answer":"运行时数据区通常包括程序计数器、虚拟机栈、本地方法栈、堆和方法区；程序计数器、虚拟机栈和本地方法栈通常是线程私有，堆和方法区由线程共享。方法区在 HotSpot 中主要由元空间实现，具体名称和细节随 JVM 版本而变化。"},{"id":235,"question":"JVM 的 TLAB（Thread-Local Allocation Buffer）是什么？","category":"JVM","answer":"TLAB 是 Eden 区中为每个线程预留的本地分配缓冲区，线程可以在其中无需竞争地快速分配对象；TLAB 用完后再申请新的区域或进行慢路径分配，从而减少多线程对象分配时的锁竞争，但过大的对象通常无法直接放入 TLAB。"},{"id":236,"question":"Java 是如何实现跨平台的？","category":"JVM","answer":"Java 源码先被编译为与平台无关的字节码，再由不同操作系统上的 JVM 解释执行或 JIT 编译为本地机器码；因此 Java 遵循一次编译、到处运行的思想，平台差异主要由 JVM 和标准类库屏蔽。"},{"id":237,"question":"编译执行与解释执行的区别是什么？JVM 使用哪种方式？","category":"JVM","answer":"解释执行是逐条读取字节码并执行，启动快但重复执行效率较低；编译执行是将代码提前或运行时编译为机器码，运行效率高但有编译成本。JVM 通常采用解释器与 JIT 编译器混合执行，先快速启动，再将热点代码编译优化。"},{"id":238,"question":"JVM 方法区是否会出现内存溢出?","category":"JVM","answer":"会。方法区或元空间用于存放类元数据、运行时常量池等内容，动态生成大量类、重复加载类、代理类未卸载或元空间上限设置过小时，可能出现 OutOfMemoryError: Metaspace；排查应关注类加载器泄漏、动态类生成和元空间参数。"},{"id":239,"question":"JVM 有那几种情况会产生 OOM（内存溢出）？","category":"JVM","answer":"常见情况包括 Java 堆对象过多导致 Java heap space，元空间类元数据耗尽导致 Metaspace，线程创建过多导致 unable to create native thread，直接内存耗尽导致 Direct buffer memory，以及进程整体受限或本地内存不足。"},{"id":240,"question":"Java 中堆和栈的区别是什么？","category":"JVM","answer":"堆是线程共享区域，主要存放对象实例和数组，由垃圾收集器管理；虚拟机栈是线程私有的，按栈帧保存局部变量、操作数栈、方法返回地址等，方法调用结束后栈帧自动销毁。堆可能产生堆溢出，栈可能产生栈溢出或线程创建失败。"},{"id":241,"question":"什么是 Java 中的直接内存（堆外内存）？","category":"JVM","answer":"直接内存是 JVM 堆之外、由本地代码分配的内存，常通过 ByteBuffer.allocateDirect 使用，适合减少 Java 堆与操作系统之间的复制；它不直接受堆大小控制，但受进程本地内存和 MaxDirectMemorySize 等限制，使用不当会造成堆外内存溢出。"},{"id":242,"question":"什么是 Java 中的常量池？","category":"JVM","answer":"常量池包括 class 文件中的常量池、运行时常量池和字符串常量池；它保存字面量、符号引用及部分运行时常量，便于类加载、链接和共享。字符串常量池用于复用相同字符串对象，具体位置和实现会随 JDK 版本变化。"},{"id":243,"question":"你了解 Java 的类加载器吗？","category":"JVM","answer":"类加载器负责按照名称查找并加载 class 字节码，通常经历加载、链接和初始化过程；Java 采用双亲委派模型，优先让父加载器尝试加载，以避免核心类被覆盖。常见加载器包括启动类加载器、平台类加载器、系统类加载器和自定义类加载器。"},{"id":244,"question":"什么是 Java 中的 JIT（Just-In-Time）?","category":"JVM","answer":"JIT 是运行时编译器，会根据方法调用次数和循环回边次数识别热点代码，将字节码编译为机器码并进行内联、逃逸分析、范围检查消除等优化；它结合运行时信息提升长期运行程序的执行效率。"},{"id":245,"question":"JIT 编译后的代码存在哪？","category":"JVM","answer":"JIT 编译后的机器码主要存放在 JVM 的 Code Cache 中，而不是 Java 堆中；Code Cache 由 JVM 管理并可能按用途划分为不同区域，空间不足时会影响编译并可能退化为解释执行，可通过相关 JVM 参数和日志监控。"},{"id":246,"question":"什么是 Java 的 AOT（Ahead-Of-Time）？","category":"JVM","answer":"AOT 是在程序运行前将字节码或源代码编译为本地机器码，减少运行时编译开销并缩短启动时间；典型应用包括 GraalVM Native Image，但 AOT 可能牺牲部分运行时动态优化能力，并对反射、动态代理和资源配置提出额外要求。"},{"id":247,"question":"你了解 Java 的逃逸分析吗？","category":"JVM","answer":"逃逸分析判断对象是否逃出当前方法或线程范围；若对象未逃逸，JIT 可能进行栈上分配、标量替换或消除不必要的同步，从而减少堆分配和 GC 压力。它是运行时优化，是否生效取决于代码形态、JIT 编译和具体 JVM 版本。"},{"id":248,"question":"Java 中的强引用、软引用、弱引用和虚引用分别是什么？","category":"JVM","answer":"强引用只要存在就不会被回收；软引用在内存紧张时可能被回收，适合内存敏感缓存；弱引用在下一次 GC 时通常会被回收，常用于规范化映射；虚引用不影响对象存活，必须配合 ReferenceQueue 使用，主要用于跟踪回收和清理堆外资源。"},{"id":249,"question":"Java 中常见的垃圾收集器有哪些？","category":"JVM","answer":"常见收集器包括 Serial、Parallel Scavenge、Parallel Old、ParNew、CMS、G1、ZGC 和 Shenandoah；它们在吞吐量、停顿时间、堆容量和并发能力上各有取舍。现代 JDK 通常优先考虑 G1，超低停顿和大堆场景可评估 ZGC 或 Shenandoah。"},{"id":250,"question":"Java 中如何判断对象是否是垃圾？不同实现方式有何区别？","category":"JVM","answer":"引用计数法通过统计引用数量判断对象，但无法解决循环引用；可达性分析从 GC Roots 出发遍历引用链，无法到达的对象才可能被回收，是主流 JVM 的判断方式。对象即使不可达，也可能经历 finalization 等特殊阶段后才真正回收。"},{"id":251,"question":"为什么 Java 的垃圾收集器将堆分为老年代和新生代？","category":"JVM","answer":"这是基于分代假说：大多数对象朝生夕死，少数对象长期存活。将堆分为新生代和老年代后，可在新生代频繁进行成本较低的 Young GC，并减少对长期存活对象的扫描，同时针对不同生命周期采用更合适的回收策略。"},{"id":252,"question":"为什么 Java 8 移除了永久代（PermGen）并引入了元空间（Metaspace）？","category":"JVM","answer":"永久代受 JVM 堆内存管理和固定大小限制，类元数据容易因动态类加载导致溢出；Java 8 使用本地内存中的元空间存放类元数据，容量更灵活，也简化了 HotSpot 与其他平台的统一。元空间仍可通过上限控制，泄漏类加载器依然可能导致 OOM。"},{"id":253,"question":"为什么 Java 新生代被划分为 S0、S1 和 Eden 区？","category":"JVM","answer":"新生代采用复制算法，Eden 用于对象首次分配，S0 和 S1 作为两个 Survivor 区交替使用；Young GC 时存活对象从 Eden 和一个 Survivor 复制到另一个 Survivor，并增加年龄，达到阈值或 Survivor 放不下时晋升老年代，从而减少碎片。"},{"id":254,"question":"什么是三色标记算法？","category":"JVM","answer":"三色标记将对象分为白色、灰色和黑色：白色表示未发现，灰色表示已发现但引用未扫描完，黑色表示对象及其引用已扫描完成；并发标记中通过写屏障、SATB 或增量更新等机制处理标记期间引用变化，避免漏标导致存活对象被误回收。"},{"id":255,"question":"Java 中的 young GC、old GC、full GC 和 mixed GC 的区别是什么？","category":"JVM","answer":"Young GC 主要回收新生代，通常停顿较短；Old GC 主要针对老年代；Full GC 通常涉及整个堆及相关区域，停顿成本较高；G1 的 Mixed GC 在并发标记后同时回收部分新生代和选定老年代 Region，但不一定回收全部老年代。"},{"id":256,"question":"什么条件会触发 Java 的 young GC？","category":"JVM","answer":"当新生代 Eden 或分配缓冲区无法满足对象分配请求时，通常会触发 Young GC；高分配速率、Survivor 区放不下、晋升担保失败和显式或调度策略也可能影响触发。具体阈值由收集器、堆布局和 JVM 参数共同决定。"},{"id":257,"question":"什么情况下会触发 Java 的 Full GC？","category":"JVM","answer":"常见触发原因包括老年代或元空间不足、晋升失败、担保失败、显式调用 System.gc、分配大对象失败、并发收集器来不及完成标记，以及某些收集器的启动或调整条件；应结合 GC 日志确认具体原因，不能仅凭次数判断。"},{"id":258,"question":"什么是 Java 的 PLAB？","category":"JVM","answer":"PLAB 是 Promotion-Local Allocation Buffer，主要用于并行 GC 线程在 Survivor 区或老年代中为晋升对象分配本地缓冲区；线程先在自己的 PLAB 中连续分配，减少多个 GC 线程竞争共享分配指针，提高并行复制和晋升效率。"},{"id":259,"question":"JVM 垃圾回收时产生的 concurrent mode failure 的原因是什么？","category":"JVM","answer":"CMS 的 Concurrent Mode Failure 通常表示并发收集过程中老年代空间不足，无法容纳新生代晋升对象或并发标记、清除未及时完成；此时 CMS 退化为 Stop-The-World 的 Full GC。应检查老年代增长、晋升速率、碎片、并发周期启动阈值和应用分配速率。"},{"id":260,"question":"为什么 Java 中 CMS 垃圾收集器在发生 Concurrent Mode Failure 时的 Full GC 是单线程的？","category":"JVM","answer":"CMS 退化的 Full GC 通常由 Serial Old 负责压缩整理老年代，早期 HotSpot 实现中该阶段主要采用单线程算法，因此会产生较长停顿；这也是 CMS 发生 Concurrent Mode Failure 代价很大的原因之一，生产中应通过提前启动并发周期、降低晋升压力和升级收集器规避。"},{"id":261,"question":"为什么 Java 中某些新生代和老年代的垃圾收集器不能组合使用？比如 ParNew 和 Parallel Old","category":"JVM","answer":"不同收集器在对象布局、同步协议、晋升策略、屏障和并行处理模型上需要兼容，某些新生代与老年代组合缺少匹配实现或收益有限，因此 JVM 会限制组合；ParNew 通常与 CMS 搭配，Parallel Scavenge 通常与 Parallel Old 搭配。"},{"id":262,"question":"JVM 新生代垃圾回收如何避免全堆扫描？","category":"JVM","answer":"新生代回收时除了扫描 GC Roots，还要处理老年代指向新生代的引用；JVM 通过卡表、记忆集和写屏障记录老年代脏卡，只扫描可能包含跨代引用的区域，而不是遍历整个老年代，从而降低 Young GC 的扫描成本。"},{"id":263,"question":"Java 的 CMS 垃圾回收器和 G1 垃圾回收器在记忆集的维护上有什么不同？","category":"JVM","answer":"CMS 主要通过卡表记录老年代到新生代的跨代引用，以支持新生代回收；G1 将堆划分为 Region，为每个 Region 维护记忆集，记录其他 Region 指向它的引用，以便只回收选定 Region。G1 的记忆集更精细但占用额外内存和维护成本。"},{"id":264,"question":"为什么 G1 垃圾收集器不维护年轻代到老年代的记忆集？","category":"JVM","answer":"G1 的老年代 Region 通常只在 Mixed GC 中作为回收集合的一部分，而 Young GC 对象存活和晋升处理可以通过扫描年轻代自身及必要的根引用完成；维护年轻代到老年代的记忆集收益有限却会增加写屏障和内存开销，因此没有按该方向维护完整记忆集。"},{"id":265,"question":"Java 中的 CMS 和 G1 垃圾收集器如何维持并发的正确性？","category":"JVM","answer":"并发标记期间应用线程仍会修改引用关系，CMS 主要通过增量更新写屏障和重新标记处理并发变化，G1 通常结合 SATB 写屏障记录被覆盖的旧引用并在最终标记阶段补偿扫描；二者都通过写屏障、重新标记和停顿阶段保证存活对象不被漏标。"},{"id":266,"question":"Java G1 相对于 CMS 有哪些进步的地方?","category":"JVM","answer":"G1 将堆划分为 Region，支持按停顿目标选择回收集合，能够整理压缩、减少 CMS 碎片和 Concurrent Mode Failure，并统一管理年轻代与老年代，适合大堆和可预测停顿场景；代价是记忆集和写屏障开销较高，需要更多调优和内存。"},{"id":267,"question":"什么是 Java 中的 logging write barrier？","category":"JVM","answer":"Logging write barrier 是在对象引用写入时记录相关变化的写屏障，通常将旧引用或卡片信息写入日志缓冲区，供并发垃圾收集器后续重新扫描和修正标记结果；它把应用线程的引用变更转化为 GC 可处理的记录，以保证并发收集正确性。"},{"id":268,"question":"Java 的 G1 垃圾回收流程是怎样的？","category":"JVM","answer":"G1 Young GC 主要复制回收年轻代 Region；并发标记周期通常经历初始标记、根区域扫描、并发标记、重新标记和清理，统计各 Region 的存活率；随后 Mixed GC 按停顿目标选择部分老年代和年轻代 Region 复制整理，最后释放空闲 Region。"},{"id":269,"question":"Java 的 CMS 垃圾回收流程是怎样的？","category":"JVM","answer":"CMS 主要经历初始标记、并发标记、重新标记和并发清除，初始标记和重新标记需要短暂停顿，并发标记和清除与应用线程同时运行；它采用标记-清除算法，不做整体压缩，因此可能产生碎片和并发失败，必要时退化为 Full GC。"},{"id":270,"question":"你了解 Java 的 ZGC（Z Garbage Collector）吗？","category":"JVM","answer":"ZGC 是面向大堆和低停顿目标的并发垃圾收集器，主要阶段与应用线程并发执行，并通过染色指针、读屏障和并发重定位实现对象移动及引用修正，停顿通常与堆容量关系较小；它适合对延迟敏感的服务，但仍需关注吞吐、内存和版本支持。"},{"id":271,"question":"JVM 垃圾回收调优的主要目标是什么？","category":"JVM","answer":"GC 调优目标是在可接受的吞吐量、平均延迟、最大停顿时间和内存占用之间取得平衡，同时保证应用稳定性和可预测性；不能只追求更少 GC 次数，应结合业务 SLA、分配速率、堆大小、收集器特性和真实监控数据综合判断。"},{"id":272,"question":"如何对 Java 的垃圾回收进行调优？","category":"JVM","answer":"先采集 GC 日志、堆使用、停顿、分配速率和对象晋升数据，确认是堆大小、对象分配、晋升、碎片还是收集器问题，再选择合适收集器，调整堆和新生代比例、并发周期阈值及停顿目标；每次只改少量参数并用生产特征压测验证。"},{"id":273,"question":"常用的 JVM 配置参数有哪些？","category":"JVM","answer":"常用参数包括 -Xms、-Xmx 设置堆初始和最大值，-Xss 设置线程栈，-XX:MetaspaceSize 和 MaxMetaspaceSize 设置元空间，-XX:+UseG1GC 选择收集器，-XX:MaxGCPauseMillis 设置 G1 停顿目标，以及 GC 日志、堆转储和 OOM 自动转储参数。"},{"id":274,"question":"你常用哪些工具来分析 JVM 性能？","category":"JVM","answer":"常用工具包括 jps、jstat、jinfo、jmap、jstack、jcmd、VisualVM、JMC、JFR、MAT 和 Arthas；它们分别用于查看进程与 GC、线程栈、堆转储、运行参数、飞行记录和对象引用链，排查时应结合监控、日志和业务指标。"},{"id":275,"question":"如何在 Java 中进行内存泄漏分析？","category":"JVM","answer":"先通过监控和 GC 日志确认老年代持续增长且 Full GC 后无法回落，再使用 jmap 或 jcmd 生成堆转储，用 MAT、VisualVM 等查看支配树、对象数量和 GC Roots 引用链，定位静态集合、监听器、ThreadLocal、缓存或类加载器泄漏，修复后进行回归验证。"},{"id":276,"question":"Java 里的对象在虚拟机里面是怎么存储的？","category":"JVM","answer":"对象通常存储在堆中，由对象头、实例数据和对齐填充组成；对象头包含标记字、类指针等信息，实例数据保存字段，数组还包含长度信息。引用变量可能位于栈、堆或方法区，具体对象布局会因 JVM、压缩指针和架构而变化。"},{"id":277,"question":"说说 Java 的执行流程?","category":"JVM","answer":"Java 源码先由编译器编译为 class 字节码，JVM 启动后由类加载器加载、链接和初始化类，执行引擎先解释字节码并识别热点代码，再由 JIT 编译为机器码执行；运行期间堆等区域由垃圾收集器管理，最终通过退出或卸载结束运行。"},{"id":278,"question":"说说 Java 中 HashMap 的原理？","category":"Java集合","answer":"HashMap 基于数组加链表或红黑树实现，通过 key 的 hash 定位数组下标，再在桶中比较 hash 和 equals 查找键值；JDK 8 中链表长度达到阈值且容量满足条件时会树化，扩容时重新分配桶位置，平均查询、插入和删除复杂度为 O(1)。"},{"id":279,"question":"什么是 Hash 碰撞？怎么解决哈希碰撞？","category":"Java集合","answer":"Hash 碰撞是不同 key 经过哈希计算后落到同一个桶中的现象；HashMap 通过链地址法将冲突元素放入链表，JDK 8 在链表过长时转为红黑树，同时结合扰动函数、合理容量和负载因子降低碰撞概率。"},{"id":280,"question":"使用 HashMap 时，有哪些提升性能的技巧？","category":"Java集合","answer":"应尽量预估数据量并设置合适初始容量，减少扩容次数；使用稳定且分布均匀的 hashCode，避免大量碰撞；控制 key 和 value 大小，避免无意义装箱和频繁创建对象，并选择合适负载因子。多线程场景不要直接使用 HashMap，应选择并发容器。"},{"id":281,"question":"Java 的 CopyOnWriteArrayList 和 Collections.synchronizedList 有什么区别？分别有什么优缺点？","category":"Java集合","answer":"CopyOnWriteArrayList 写操作复制底层数组后修改，读操作通常无需加锁，适合读多写少但写入成本高且存在数据快照延迟；synchronizedList 通过同步锁保护每个方法，读写都可能竞争，实时性较好但并发读性能较低，遍历复合操作仍需外部同步。"},{"id":282,"question":"Java 中有哪些集合类？请简单介绍","category":"Java集合","answer":"Java 集合主要包括 Collection 和 Map 两大体系；Collection 下有 List、Set 和 Queue，分别强调有序可重复、唯一性以及队列处理，常见实现有 ArrayList、LinkedList、HashSet、TreeSet 和 ArrayDeque；Map 保存键值映射，常见实现有 HashMap、TreeMap 和 ConcurrentHashMap。"},{"id":283,"question":"数组和链表在 Java 中的区别是什么？","category":"Java集合","answer":"数组内存连续、支持按下标 O(1) 随机访问，但扩容和中间插入删除成本较高；链表节点通过指针连接，插入删除在已定位节点处较快，但随机访问需要遍历且有额外节点内存开销。实际选择取决于访问模式、修改频率和缓存局部性。"},{"id":284,"question":"Java 中的 List 接口有哪些实现类？","category":"Java集合","answer":"常见实现包括基于动态数组的 ArrayList、基于双向链表的 LinkedList、线程安全且写时复制的 CopyOnWriteArrayList，以及遗留的 Vector；实际开发通常优先使用 ArrayList，读多写少并发场景可考虑 CopyOnWriteArrayList。"},{"id":285,"question":"Java 中 ArrayList 和 LinkedList 有什么区别？","category":"Java集合","answer":"ArrayList 基于动态数组，按索引访问快、缓存局部性好，但中间插入删除需要移动元素；LinkedList 基于双向链表，首尾操作方便、已定位节点插入删除快，但随机访问慢且节点对象有额外内存开销。多数场景 ArrayList 性能更好。"},{"id":286,"question":"Java ArrayList 的扩容机制是什么？","category":"Java集合","answer":"ArrayList 容量不足时会创建更大的数组并复制原有元素，JDK 8 通常按旧容量的 1.5 倍扩容，并受最大数组长度限制；扩容涉及数组复制，因此可通过构造器预设合理初始容量减少扩容次数。"},{"id":287,"question":"Java 中的 HashMap 和 Hashtable 有什么区别？","category":"Java集合","answer":"HashMap 允许一个 null key 和多个 null value，默认非线程安全，性能和扩展性更好；Hashtable 方法大多使用 synchronized，线程竞争更明显，不允许 null key 或 value，属于遗留类。并发场景通常推荐 ConcurrentHashMap 而不是 Hashtable。"},{"id":288,"question":"ConcurrentHashMap 和 Hashtable 的区别是什么？","category":"Java集合","answer":"Hashtable 通过对方法整体加 synchronized 保证线程安全，锁粒度较大；ConcurrentHashMap 使用更细粒度的同步、CAS 和并发控制，读操作通常无需整体加锁，并支持更高并发吞吐。两者都不允许 null key 或 null value。"},{"id":289,"question":"Java 中的 HashSet 和 HashMap 有什么区别？","category":"Java集合","answer":"HashSet 实现 Set 接口，只保存不重复的元素，底层通常基于 HashMap，将元素作为 key、固定对象作为 value；HashMap 实现 Map 接口，保存键值对并允许 value 重复。两者都依赖 hashCode 和 equals 判断元素或键的唯一性。"},{"id":290,"question":"Java 中 HashMap 的扩容机制是怎样的？","category":"Java集合","answer":"当元素数量超过容量乘负载因子得到的 threshold 时，HashMap 将容量扩大为原来的两倍并迁移元素；因为容量是 2 的幂，元素的新位置只需判断原下标对应的高位新增比特，通常可拆分为原位置或原位置加旧容量，减少重新计算成本。"},{"id":291,"question":"为什么 HashMap 在 Java 中扩容时采用 2 的 n 次方倍？","category":"Java集合","answer":"容量为 2 的幂时，数组下标可通过 hash 与 length-1 按位与快速计算，避免取模；扩容翻倍后，元素只需根据新增高位判断留在原位置还是移动旧容量，迁移效率高且能保持较好的分布。"},{"id":292,"question":"为什么 Java 中 HashMap 的默认负载因子是 0.75？","category":"Java集合","answer":"负载因子越低碰撞越少但空间浪费越大，越高则空间利用率高但碰撞和链表长度增加；0.75 是时间和空间之间的经验折中，使哈希桶保持较好的分布并控制扩容频率，具体场景可根据内存和访问特征调整。"},{"id":293,"question":"为什么 JDK 1.8 对 HashMap 进行了红黑树的改动？","category":"Java集合","answer":"JDK 8 在链表过长时将其树化为红黑树，使极端哈希碰撞下的查询、插入和删除由 O(n) 降低到 O(logn)，提升最坏场景性能；为避免小容量下树化收益不明显，通常会优先扩容，达到最小树化容量后才转换。"},{"id":294,"question":"JDK 1.8 对 HashMap 除了红黑树还进行了哪些改动？","category":"Java集合","answer":"JDK 8 取消了头插法，采用尾插法降低并发扩容时形成环链的风险；扩容时利用高位 hash 判断元素留在原桶还是移动旧容量，减少重新计算；同时优化了扩容和树化阈值，并使用扰动函数改善 hash 分布。"},{"id":295,"question":"Java 中的 LinkedHashMap 是什么？","category":"Java集合","answer":"LinkedHashMap 在 HashMap 的哈希表基础上增加双向链表，用于维护插入顺序或访问顺序，因此遍历结果稳定；它支持 accessOrder 配置，结合 removeEldestEntry 可实现简单的 LRU 缓存，但本身并不是高并发容器。"},{"id":296,"question":"Java 中的 TreeMap 是什么？","category":"Java集合","answer":"TreeMap 基于红黑树实现有序键值映射，按 key 的自然顺序或 Comparator 排序，查找、插入和删除平均为 O(logn)；它适合范围查询、最小最大键和有序遍历，但不允许比较规则不一致导致的键冲突，且默认非线程安全。"},{"id":297,"question":"Java 中的 IdentityHashMap 是什么？","category":"Java集合","answer":"IdentityHashMap 使用 == 而不是 equals 判断 key 是否相同，因此只有引用完全相同才视为同一个键；它适合对象图遍历、序列化或需要区分不同对象实例的场景，不适合作为普通业务 Map，因为语义与常规 Map 不同。"},{"id":298,"question":"Java 中的 WeakHashMap 是什么 ？","category":"Java集合","answer":"WeakHashMap 的 key 使用弱引用，当 key 不再被其他强引用持有时，垃圾收集器可能回收该 key，Entry 会通过引用队列被清理；它适合实现与对象生命周期绑定的缓存或元数据映射，但不适合要求数据稳定持久存在的场景。"},{"id":299,"question":"Java 中 ConcurrentHashMap 1.7 和 1.8 之间有哪些区别？","category":"Java集合","answer":"JDK 1.7 使用 Segment 分段锁，将哈希表划分为多个段；JDK 1.8 取消 Segment，采用数组、链表或红黑树，并结合 CAS 与 synchronized 对桶或节点进行细粒度控制，同时优化了扩容协作和计数方式，整体并发度与性能更好。"},{"id":300,"question":"Java 中 ConcurrentHashMap 的 get 方法是否需要加锁？","category":"Java集合","answer":"通常不需要显式加锁，ConcurrentHashMap 的 get 主要依靠 volatile 可见性、CAS 和节点结构保证读取安全，读操作可以与写操作并发进行；但复合操作如先判断再更新不能仅依赖 get 保证原子性，应使用 putIfAbsent、compute 等原子方法。"},{"id":301,"question":"为什么 Java 的 ConcurrentHashMap 不支持 key 或 value 为 null？","category":"Java集合","answer":"ConcurrentHashMap 不允许 null，是为了避免并发读取时无法区分键不存在和键对应值为 null；例如 get 返回 null 时可以明确表示没有映射，从而简化并发语义和实现。需要存储空值时应使用特殊占位对象或其他业务标记。"},{"id":302,"question":"Java 中的 CopyOnWriteArrayList 是什么？","category":"Java集合","answer":"CopyOnWriteArrayList 是线程安全的 List，写操作会复制底层数组，在新数组上完成修改后再替换引用，读操作通常无需加锁并可获得稳定快照；它适合读多写少、遍历频繁的场景，但写入成本高、占用内存大且读取可能暂时看不到最新数据。"},{"id":303,"question":"你遇到过 ConcurrentModificationException 错误吗？它是如何产生的？","category":"Java集合","answer":"ConcurrentModificationException 通常发生在使用迭代器遍历集合时，集合结构被非迭代器方式修改，迭代器通过 modCount 检测到预期修改次数不一致；应使用 Iterator.remove、集合的 removeIf，或使用并发容器，并注意它是 fail-fast 提示而非严格并发安全保证。"},{"id":304,"question":"什么是 Java 中的线程同步？","category":"Java并发","answer":"线程同步是通过锁、同步器、原子操作等机制协调多个线程对共享资源的访问，使同一时刻只有满足条件的线程执行关键操作，从而避免竞态条件并保证数据一致性；常见手段包括 synchronized、Lock、volatile、CAS 和并发工具类。"},{"id":305,"question":"Java 中的线程安全是什么意思？","category":"Java并发","answer":"线程安全是指多个线程并发访问同一对象或资源时，程序仍能保持正确性、可见性和一致性，不会产生数据竞争或破坏不变式；实现方式包括无状态设计、不可变对象、锁、原子类、并发容器和正确的内存可见性控制。"},{"id":306,"question":"什么是协程？Java 支持协程吗？","category":"Java并发","answer":"协程是用户态调度的轻量级执行单元，能够在代码中主动挂起和恢复，切换成本通常低于线程；传统 Java 线程本身不是协程，较新的 Java 版本通过 Project Loom 提供虚拟线程，虽与协程目标相近但由 JVM 调度并采用线程 API。"},{"id":307,"question":"线程的生命周期在 Java 中是如何定义的？","category":"Java并发","answer":"Java Thread 状态包括 NEW、RUNNABLE、BLOCKED、WAITING、TIMED_WAITING 和 TERMINATED；线程创建后处于 NEW，调用 start 后进入可运行状态，竞争锁时为 BLOCKED，等待通知或条件时为 WAITING，带超时时等待为 TIMED_WAITING，执行结束后进入 TERMINATED。"},{"id":308,"question":"Java 中线程之间如何进行通信？","category":"Java并发","answer":"线程通信可以通过共享内存配合 synchronized、volatile、Lock 和 Condition，也可以使用 wait/notify、阻塞队列、CountDownLatch、Semaphore、Future/CompletableFuture 等高级工具；选择时应优先使用明确的并发抽象，避免直接操作共享变量。"},{"id":309,"question":"Java 中如何创建多线程？","category":"Java并发","answer":"可以继承 Thread、实现 Runnable 或 Callable 并交给 Thread 执行，也可以通过 ExecutorService、线程池、CompletableFuture 或 ForkJoinPool 创建和管理任务；实际开发通常优先使用线程池或异步框架，避免频繁创建和销毁原生线程。"},{"id":310,"question":"你了解 Java 线程池的原理吗？","category":"Java并发","answer":"线程池通过维护工作线程、任务队列和拒绝策略复用线程：提交任务时先创建核心线程，核心线程满后进入队列，队列满且未达到最大线程数时创建非核心线程，仍无法接收则执行拒绝策略；线程空闲超时后可回收，关闭时停止接收新任务。"},{"id":311,"question":"如何合理地设置 Java 线程池的线程数？","category":"Java并发","answer":"CPU 密集型任务通常将线程数设置为接近 CPU 核数并留出系统余量，I/O 密集型任务可根据等待时间、CPU 利用率、外部连接池容量和压测结果适当增加；不能只套固定公式，还要结合任务耗时、队列容量、最大并发和系统可承受资源设置。"},{"id":312,"question":"Java 线程池有哪些拒绝策略？","category":"Java并发","answer":"JDK 提供 AbortPolicy 直接抛 RejectedExecutionException、CallerRunsPolicy 由提交线程执行、DiscardPolicy 静默丢弃和 DiscardOldestPolicy 丢弃队列最旧任务后重试；生产环境应根据任务重要性设计自定义策略、告警、降级或持久化补偿，不能无声丢数据。"},{"id":313,"question":"Java 并发库中提供了哪些线程池实现？它们有什么区别？","category":"Java并发","answer":"Executors 可创建固定线程池、单线程池、缓存线程池、定时线程池和工作窃取线程池，底层分别对应 ThreadPoolExecutor、ScheduledThreadPoolExecutor 或 ForkJoinPool；生产环境通常直接构造 ThreadPoolExecutor，明确线程数、队列和拒绝策略，避免 Executors 默认队列或线程数失控。"},{"id":314,"question":"Java 线程池核心线程数在运行过程中能修改吗？如何修改？","category":"Java并发","answer":"可以，ThreadPoolExecutor 提供 setCorePoolSize 和 setMaximumPoolSize 动态修改核心线程数和最大线程数；调大核心数可提高并发，调小时空闲线程会按策略退出，修改时应保证 corePoolSize 不大于 maximumPoolSize，并结合监控和压测逐步调整。"},{"id":315,"question":"Java 线程池中 shutdown 与 shutdownNow 的区别是什么？","category":"Java并发","answer":"shutdown 会停止接收新任务，但会等待队列中的已提交任务执行完成；shutdownNow 会尝试中断正在执行的线程，并返回尚未开始执行的队列任务，但中断不保证任务立即停止。两者都不能强制终止不响应中断的任务，使用后应配合 awaitTermination。"},{"id":316,"question":"Java 线程池内部任务出异常后，如何知道是哪个线程出了异常？","category":"Java并发","answer":"使用 execute 提交任务时，未捕获异常通常会通过线程的 UncaughtExceptionHandler 输出并结束工作线程；使用 submit 时异常会封装在 Future 中，必须调用 get 才能发现。可自定义 ThreadFactory 设置线程名和异常处理器，或重写 afterExecute 统一记录任务、线程和异常信息。"},{"id":317,"question":"Java 中的 DelayQueue 和 ScheduledThreadPool 有什么区别？","category":"Java并发","answer":"DelayQueue 是无界阻塞队列，元素实现 Delayed，只有到期后才能被取出，适合延迟任务队列但不负责执行任务；ScheduledThreadPoolExecutor 既管理定时触发又执行任务，支持周期任务和任务调度。前者强调数据结构，后者强调调度执行。"},{"id":318,"question":"什么是 Java 的 Timer？","category":"Java并发","answer":"Timer 是 Java 早期提供的单线程定时任务工具，使用 TimerTask 按指定时间或周期执行任务；一个任务未完成会阻塞后续任务，未捕获运行时异常还可能终止 Timer 线程。现代项目通常使用 ScheduledThreadPoolExecutor，具备线程池和更好的异常隔离能力。"},{"id":319,"question":"你了解时间轮（Time Wheel）吗？有哪些应用场景？","category":"Java并发","answer":"时间轮将时间划分为多个槽位，任务按到期时间映射到槽，指针每次移动一个刻度并处理当前槽任务，能以较低成本管理大量定时任务；它常用于网络超时、连接失效、延迟消息、重试、限流和定时调度，精度取决于刻度大小。"},{"id":320,"question":"你使用过哪些 Java 并发工具类？","category":"Java并发","answer":"常用工具包括 CountDownLatch、CyclicBarrier、Semaphore、Exchanger、Phaser、BlockingQueue、ConcurrentHashMap、Atomic 类、LongAdder、ReentrantLock、ReadWriteLock、StampedLock、CompletableFuture 和 ForkJoinPool；应根据等待、限流、协调、异步或共享数据场景选择。"},{"id":321,"question":"什么是 Java 的 Semaphore？","category":"Java并发","answer":"Semaphore 是基于许可证数量控制并发访问的同步器，线程通过 acquire 获取许可、release 归还许可；它适合限流、连接池和资源池等场景，既可实现互斥锁，也可允许固定数量线程同时访问资源，并支持公平模式和可中断获取。"},{"id":322,"question":"什么是 Java 的 CyclicBarrier？","category":"Java并发","answer":"CyclicBarrier 让一组线程互相等待，所有参与线程到达屏障点后一起继续执行，并可在每轮汇合前执行 barrier action；它支持重复使用，适合多阶段并行计算。与 CountDownLatch 不同，CyclicBarrier 的参与线程可以重复汇合且通常由线程自己调用 await。"},{"id":323,"question":"什么是 Java 的 CountDownLatch？","category":"Java并发","answer":"CountDownLatch 维护一个不可重置的计数器，调用 await 的线程等待计数归零，其他线程通过 countDown 递减计数；它适合等待多个任务完成或控制统一启动，但一次使用后不能复用，需要重复使用时可考虑 CyclicBarrier 或 Phaser。"},{"id":324,"question":"什么是 Java 的 StampedLock？","category":"Java并发","answer":"StampedLock 提供写锁、悲观读锁和乐观读锁，读操作可先获取 stamp 并在校验期间无写入时直接读取，降低读多写少场景的锁开销；它不支持重入，使用乐观读必须校验 stamp，且要正确处理锁升级、释放和异常路径。"},{"id":325,"question":"什么是 Java 的 CompletableFuture？","category":"Java并发","answer":"CompletableFuture 是支持异步计算、结果组合和异常处理的 Future 实现，可通过 supplyAsync、thenApply、thenCompose、allOf、anyOf 等方法构建非阻塞任务链；它能组合多个异步结果，但应明确线程池、异常传播和超时策略，避免使用公共线程池承载阻塞任务。"},{"id":326,"question":"什么是 Java 的 ForkJoinPool？","category":"Java并发","answer":"ForkJoinPool 面向可递归拆分的任务，采用工作窃取算法：每个工作线程维护任务队列，空闲线程从其他线程队列末端窃取任务；它适合计算密集型分治任务和并行流，但不适合长时间阻塞 I/O，除非进行专门隔离和补偿。"},{"id":327,"question":"如何在 Java 中控制多个线程的执行顺序？","category":"Java并发","answer":"可以使用线程 join、CountDownLatch、CyclicBarrier、Semaphore、Future 依赖、CompletableFuture 链式编排或显式锁与 Condition 控制阶段；优先将依赖关系表达为任务编排，避免通过 Thread.sleep 等不可靠的时间等待控制顺序。"},{"id":328,"question":"你使用过 Java 中的哪些阻塞队列？","category":"Java并发","answer":"常用阻塞队列包括 ArrayBlockingQueue、LinkedBlockingQueue、PriorityBlockingQueue、DelayQueue、SynchronousQueue 和 LinkedTransferQueue；它们分别适合有界 FIFO、可选有界 FIFO、优先级、延迟、直接移交和高性能转移场景，选择时要关注容量、排序和阻塞语义。"},{"id":329,"question":"你使用过 Java 中的哪些原子类？","category":"Java并发","answer":"常用原子类包括 AtomicInteger、AtomicLong、AtomicBoolean、AtomicReference、AtomicStampedReference、AtomicMarkableReference，以及数组和字段更新器；它们通过 CAS 提供单变量原子操作，适合计数、状态更新和无锁引用替换，但不能自动保证多个变量组合操作的原子性。"},{"id":330,"question":"你使用过 Java 的累加器吗？","category":"Java并发","answer":"Java 8 提供 LongAdder、DoubleAdder 以及 LongAccumulator、DoubleAccumulator，内部通过分散到多个 Cell 降低高并发更新时的 CAS 竞争，最后汇总结果；它们适合高并发统计，读取时不是严格线性一致的，若需要精确单值语义应选择 AtomicLong 或锁。"},{"id":331,"question":"什么是 Java 的 CAS（Compare-And-Swap）操作？","category":"Java并发","answer":"CAS 是一种原子更新操作，比较内存位置当前值与预期值，相等时才替换为新值，否则失败并可重试；它避免了传统互斥锁阻塞，但可能产生自旋开销、ABA 问题和高竞争性能下降，Java 原子类和并发容器大量使用 CAS。"},{"id":332,"question":"说说 AQS 吧？","category":"Java并发","answer":"AQS 是 AbstractQueuedSynchronizer，通过一个 volatile state 表示同步状态，并用 CLH 队列管理获取不到资源的线程；子类通过实现 tryAcquire、tryRelease 等方法定义同步语义，AQS 统一提供排队、阻塞、唤醒、独占和共享模式，是 ReentrantLock、Semaphore、CountDownLatch 等组件的基础。"},{"id":333,"question":"Java 中 ReentrantLock 的实现原理是什么？","category":"Java并发","answer":"ReentrantLock 基于 AQS 实现，独占模式下用 state 表示持有次数，并记录当前持有线程；同一线程重复获取会递增 state，释放时递减到零才真正唤醒后继线程。它支持公平和非公平策略、可中断获取、超时尝试、公平排队和多个 Condition。"},{"id":334,"question":"Java 的 synchronized 是怎么实现的？","category":"Java并发","answer":"synchronized 基于对象监视器实现，编译后可表现为 monitorenter 和 monitorexit 指令或方法级 ACC_SYNCHRONIZED 标志；JVM 会根据竞争情况使用偏向、轻量级或重量级锁等优化机制，保证互斥、可见性和有序性，退出同步块时即使异常也会释放监视器。"},{"id":335,"question":"Synchronized 修饰静态方法和修饰普通方法有什么区别？","category":"Java并发","answer":"synchronized 静态方法锁的是对应 Class 对象，同一个类的所有实例共享该锁；synchronized 普通实例方法锁的是当前 this 对象，不同实例之间互不阻塞。同步代码块则可明确指定锁对象，锁对象的选择决定并发粒度。"},{"id":336,"question":"Java 中的 synchronized 轻量级锁是否会进行自旋？","category":"Java并发","answer":"可能会。轻量级锁竞争时，线程通常会通过自旋尝试获取锁，若锁持有时间短则避免阻塞和线程切换；自旋次数和是否升级取决于 JVM 版本、竞争情况及自适应自旋策略，竞争激烈或持锁时间长时可能膨胀为重量级锁。"},{"id":337,"question":"Synchronized 能不能禁止指令重排序？","category":"Java并发","answer":"能在同步语义范围内禁止影响正确性的重排序，并通过 monitor 的进入和退出建立 happens-before 关系，保证线程对共享数据的可见性和有序性；它不是让所有机器指令绝对不重排，而是限制重排结果不能破坏同步语义。"},{"id":338,"question":"当 Java 的 synchronized 升级到重量级锁后，所有线程都释放锁了，此时它还是重量级锁吗？","category":"Java并发","answer":"通常仍保留膨胀后的重量级锁状态，不会因为暂时没有竞争就自动回退为轻量级或偏向锁；后续线程再次竞争时可直接使用已有监视器结构，避免频繁升级和降级带来的额外成本。"},{"id":339,"question":"什么是 Java 中的锁自适应自旋？","category":"Java并发","answer":"锁自适应自旋会根据近期同一锁的竞争结果动态调整自旋次数：如果自旋经常成功，后续可能多自旋；如果经常失败或持锁时间长，则减少自旋甚至直接阻塞。它通过运行时反馈在 CPU 消耗与线程切换成本之间取得平衡。"},{"id":340,"question":"Synchronized 和 ReentrantLock 有什么区别？","category":"Java并发","answer":"synchronized 是语言级关键字，使用简单且异常时自动释放锁；ReentrantLock 是 API，必须显式 unlock，但支持可中断获取、超时尝试、公平策略和多个 Condition。普通互斥优先使用 synchronized，需要高级控制时选择 ReentrantLock。"},{"id":341,"question":"Volatile 与 Synchronized 的区别是什么？","category":"Java并发","answer":"volatile 保证变量的可见性和一定的有序性，但不保证复合操作原子性，也不阻塞线程；synchronized 保证互斥、可见性和有序性，能保护临界区内的复合操作，但有锁竞争和调度成本。单次状态发布可用 volatile，复合逻辑应使用锁或原子类。"},{"id":342,"question":"如何优化 Java 中的锁的使用？","category":"Java并发","answer":"应缩小临界区、减少锁内 I/O 和复杂计算，选择合适锁粒度与并发工具，优先使用不可变对象和无状态设计，避免锁嵌套及不一致的加锁顺序；读多写少可考虑读写锁或 StampedLock，高竞争计数可使用 LongAdder，并通过监控和压测验证。"},{"id":343,"question":"你了解 Java 中的读写锁吗？","category":"Java并发","answer":"读写锁将访问分为共享读锁和独占写锁，多个读线程可并发读取，但写线程需要排他访问；ReentrantReadWriteLock 支持公平策略和锁降级，适合读多写少场景，但写竞争、读写转换和锁升级可能影响性能，使用前应评估实际读写比例。"},{"id":344,"question":"什么是 Java 内存模型（JMM）？","category":"Java并发","answer":"JMM 是 Java 对线程间共享变量读写、可见性、原子性和有序性的抽象规范，定义了主内存、工作内存以及 volatile、锁、final 和 happens-before 等规则；它屏蔽硬件内存模型差异，让开发者能够正确推理并发程序行为。"},{"id":345,"question":"什么是 Java 中的原子性、可见性和有序性？","category":"Java并发","answer":"原子性是操作不可分割，中间状态不会被其他线程观察；可见性是一个线程修改后其他线程能及时看到；有序性是程序执行结果符合规定顺序、不会被不当重排。锁、volatile、原子类和 happens-before 规则共同帮助保证这三种并发属性。"},{"id":346,"question":"什么是 Java 的 happens-before 规则？","category":"Java并发","answer":"happens-before 是 JMM 中判断可见性和有序性的规则，若一个动作 happens-before 另一个动作，则前者结果对后者可见且顺序受保证；常见规则包括程序次序、解锁先于加锁、volatile 写先于读、线程 start 先于线程动作、线程所有动作先于 join 返回。"},{"id":347,"question":"什么是 Java 中的指令重排？","category":"Java并发","answer":"指令重排是编译器、JIT 或处理器在不改变单线程语义的前提下调整指令执行顺序，以提升性能；在多线程环境中可能导致其他线程观察到未完成初始化或旧值。volatile、锁和 happens-before 规则会限制可能影响并发正确性的重排。"},{"id":348,"question":"Java 中的 final 关键字是否能保证变量的可见性？","category":"Java并发","answer":"final 不能像 volatile 一样保证变量后续修改的可见性，但 JMM 对 final 字段提供特殊初始化安全语义：对象构造完成且没有 this 逸出时，其他线程能正确看到 final 字段的初始值；如果对象构造期间逸出或通过反射修改，仍可能出现问题。"},{"id":349,"question":"为什么在 Java 中需要使用 ThreadLocal？","category":"Java并发","answer":"ThreadLocal 为每个线程提供独立的变量副本，使线程可以安全保存上下文、用户信息、事务资源或格式化对象，减少共享状态和显式同步；它适合线程内隔离数据，但在线程池环境中必须及时 remove，避免数据串线和内存泄漏。"},{"id":350,"question":"Java 中的 ThreadLocal 是如何实现线程资源隔离的？","category":"Java并发","answer":"每个线程内部维护 ThreadLocalMap，ThreadLocal 作为 key、线程对应的值作为 value；调用 set、get 时根据当前线程访问自己的 Map，因此不同线程互不读取对方数据。ThreadLocal 本身不存储每线程副本，线程退出或显式 remove 后相关数据才会清理。"},{"id":351,"question":"为什么 Java 中的 ThreadLocal 对 key 的引用为弱引用？","category":"Java并发","answer":"使用弱引用作为 key 可让 ThreadLocal 对象在外部不再使用时被 GC 回收，避免 key 永久占用；但 value 仍可能暂时保留在线程的 ThreadLocalMap 中，尤其在线程池线程长期存活时，因此不能只依赖弱引用，使用完必须显式 remove。"},{"id":352,"question":"Java 中使用 ThreadLocal 的最佳实践是什么？","category":"Java并发","answer":"应将 ThreadLocal 声明为合适的静态或实例成员，限制作用域，在线程池任务 finally 中调用 remove，避免存放大对象和跨任务共享状态，并明确初始化和默认值；涉及数据库连接、用户上下文等资源时还要确保异常和异步切换时正确清理。"},{"id":353,"question":"Java 中的 InheritableThreadLocal 是什么？","category":"Java并发","answer":"InheritableThreadLocal 允许子线程在创建时继承父线程的线程本地变量副本，适合简单的父子线程上下文传递；它只在线程创建时复制，在线程池复用线程或异步框架中可能失效并造成上下文污染，复杂场景应使用专门的上下文传递方案。"},{"id":354,"question":"ThreadLocal 的缺点？","category":"Java并发","answer":"ThreadLocal 会增加线程本地状态的隐蔽性和排查难度，在线程池中若不 remove 可能造成内存泄漏、数据串线和旧上下文污染；它不能自然跨线程传递，也不适合存放大对象或需要全局共享的数据，应谨慎控制生命周期和使用范围。"},{"id":355,"question":"为什么 Netty 不使用 ThreadLocal 而是自定义了一个 FastThreadLocal ？","category":"Java并发","answer":"传统 ThreadLocalMap 使用哈希查找和 Entry 对象，在 Netty 大量线程本地变量场景下有额外开销；FastThreadLocal 将变量索引到 InternalThreadLocalMap 的数组中，通过预分配的整数索引实现更快访问，并配合清理机制管理生命周期，代价是需要维护索引和数组空间。"},{"id":356,"question":"什么是 Java 的 TransmittableThreadLocal？","category":"Java并发","answer":"TransmittableThreadLocal 是用于在线程池、异步任务等线程复用场景传递上下文的扩展，它在任务提交或包装时捕获父线程上下文，在执行线程中恢复并在结束后还原；它适合传递链路追踪和用户上下文，但必须控制传播范围并避免上下文数据过大。"},{"id":357,"question":"Java 中 Thread.sleep
